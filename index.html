ic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Salk_Institute_(4).jpg"},{"id":"copan","t":"Edificio Copan","a":"Oscar Niemeyer","y":1966,"yd":"1952–1966","c":"São Paulo","p":"Brasil","per":"s20","est":"Modernismo brasileño","esc":"edificio","tags":["latam","pritzker"],"d":"Uno de los edificios residenciales más grandes de Latinoamérica, con más de 1.100 departamentos y unos 5.000 habitantes. Tiene hasta código postal propio.","k":"La gran S de parasoles horizontales que se curva sobre la manzana.","img":1,"cr":"Pablo Trincado","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Edif%C3%ADcio_Copan_-_frente.jpg"},{"id":"leca","t":"Piscinas de Leça da Palmeira","a":"Álvaro Siza","y":1966,"yd":"1961–1966","c":"Matosinhos","p":"Portugal","per":"s20","est":"Regionalismo crítico","esc":"conjunto","tags":["pritzker"],"d":"Piscinas de agua de mar construidas entre las rocas de la costa atlántica. Siza tenía menos de 30 años cuando las proyectó.","k":"Muros de hormigón que solo completan lo que las rocas casi cerraban: la arquitectura casi desaparece.","img":1,"cr":"Mark from San Francisco, CA, USA","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Piscina_Mares_(Leca_Palmeira).jpg"},{"id":"bancolondres","t":"Banco de Londres y América del Sud","a":"Clorindo Testa con SEPRA","y":1966,"yd":"1960–1966","c":"Buenos Aires","p":"Argentina","per":"s20","est":"Brutalismo","esc":"edificio","tags":["latam"],"d":"Edificio bancario en el centro histórico de Buenos Aires, hoy Banco Hipotecario. Reinterpreta las arcadas de la cuadra con hormigón expuesto.","k":"La planta baja como una gran sala pública sin columnas interiores, con pisos colgados a distintas alturas.","img":1,"cr":"M47E.62M","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Banco_de_Londres_y_Am%C3%A9rica_del_Sur.jpg"},{"id":"habitat67","t":"Habitat 67","a":"Moshe Safdie","y":1967,"yd":"1967","c":"Montreal","p":"Canadá","per":"s20","est":"Brutalismo / Metabolismo","esc":"conjunto","tags":[],"d":"Proyecto de tesis de Safdie construido para la Expo 67. Vivienda en la ciudad con los beneficios de una casa con jardín.","k":"354 módulos prefabricados de hormigón apilados de modo que cada techo es la terraza del vecino.","co":[45.5,-73.5439],"img":1,"cr":"Parcours riverain - Ville de Montréal from Canada","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Habitat_67,_2600,_avenue_Pierre-Dupuy_(Ville-Marie)_(35399872943).jpg"},{"id":"masp","t":"MASP","a":"Lina Bo Bardi","y":1968,"yd":"1957–1968","c":"São Paulo","p":"Brasil","per":"s20","est":"Brutalismo","esc":"edificio","tags":["latam","mujer"],"d":"El museo flota sobre una plaza pública gracias a dos pórticos rojos con una luz libre de 74 m. Lina expuso los cuadros sobre caballetes de vidrio.","k":"El 'vano libre' debajo del museo, que se usa para feria, protestas y conciertos.","co":[-23.5611,-46.6558],"img":1,"cr":"ProtoplasmaKid","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Vista_a%C3%A9rea_de_la_Avenida_Paulista_de_S%C3%A3o_Paulo_05.jpg"},{"id":"neviges","t":"Iglesia de peregrinación de Neviges","a":"Gottfried Böhm","y":1968,"yd":"1966–1968","c":"Velbert","p":"Alemania","per":"s20","est":"Expresionismo brutalista","esc":"edificio","tags":["pritzker"],"d":"Una montaña de hormigón plegado para miles de peregrinos. Böhm fue el primer alemán en ganar el Pritzker, en 1986.","k":"El techo cristalino como roca facetada, y las calles interiores que continúan el camino del peregrino.","img":1,"cr":"Rabanus Flavus","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Neviges_Mariendom.jpg"},{"id":"ford","t":"Fundación Ford","a":"Kevin Roche y John Dinkeloo","y":1968,"yd":"1963–1968","c":"Nueva York","p":"Estados Unidos","per":"s20","est":"Modernismo tardío","esc":"edificio","tags":["pritzker"],"d":"Oficinas organizadas alrededor de un jardín cubierto de 12 pisos. Fue uno de los primeros atrios verdes en un edificio de oficinas.","k":"Las oficinas miran al jardín interior y entre sí: el edificio expresa una comunidad de trabajo.","co":[40.7497,-73.9711],"img":1,"cr":"Stakhanov","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Ford_foundation_building_1.JPG"},{"id":"fauusp","t":"FAU-USP","a":"João Batista Vilanova Artigas y Carlos Cascaldi","y":1969,"yd":"1961–1969","c":"São Paulo","p":"Brasil","per":"s20","est":"Brutalismo paulista","esc":"edificio","tags":["latam"],"d":"La facultad de arquitectura de São Paulo: un solo gran espacio sin puertas de entrada. Artigas la pensó como un espacio democrático.","k":"Las rampas suaves que conectan todos los niveles alrededor de un salón central bajo una cubierta de luz cenital.","co":[-23.5601,-46.7298],"img":1,"cr":"Photograph by Mike Peel (www.mikepeel.net).","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Architecture_and_Urbanism_College_of_University_of_S%C3%A3o_Paulo_2016_03.jpg"},{"id":"torresparque","t":"Torres del Parque","a":"Rogelio Salmona","y":1970,"yd":"1964–1970","c":"Bogotá","p":"Colombia","per":"s20","est":"Modernismo de ladrillo","esc":"conjunto","tags":["latam"],"d":"Tres torres de vivienda de ladrillo que se escalonan junto a la plaza de toros y los cerros. Salmona trabajó en el estudio de Le Corbusier en París.","k":"El ladrillo como único material, en curvas y terrazas que suben hacia los cerros orientales.","img":1,"cr":"Felipe Restrepo Acosta","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:2017_Bogot%C3%A1_Torres_del_Parque_desde_el_Parque_de_la_Independencia.jpg"},{"id":"kimbell","t":"Museo de Arte Kimbell","a":"Louis Kahn","y":1972,"yd":"1966–1972","c":"Fort Worth, Texas","p":"Estados Unidos","per":"contemp","est":"Modernismo monumental","esc":"edificio","tags":[],"d":"Una serie de bóvedas de hormigón paralelas con una ranura de luz en lo más alto. La luz natural es el material principal del museo.","k":"Los reflectores de aluminio perforado bajo cada ranura reparten la luz plateada sobre las bóvedas.","co":[32.7486,-97.365],"img":1,"cr":"Carol M. Highsmith","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Kimbell_Art_Museum_Highsmith.jpg"},{"id":"munich","t":"Parque Olímpico de Múnich","a":"Behnisch & Partner con Frei Otto","y":1972,"yd":"1968–1972","c":"Múnich","p":"Alemania","per":"contemp","est":"Estructuras tensadas","esc":"conjunto","tags":["pritzker"],"d":"Una gran cubierta de red de cables y acrílico sobre los estadios de los Juegos de 1972. Frei Otto ganó el Pritzker en 2015, días después de morir.","k":"La cubierta liviana, como una tela de araña transparente, contrasta con las colinas artificiales del parque.","co":[48.1731,11.5467],"img":1,"cr":"Amrei-Marie","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Blick_vom_Olympiaberg_auf_das_Olympiastadion.jpg"},{"id":"sydney","t":"Ópera de Sídney","a":"Jørn Utzon","y":1973,"yd":"1959–1973","c":"Sídney","p":"Australia","per":"contemp","est":"Expresionismo moderno","esc":"edificio","tags":["pritzker"],"d":"Utzon ganó el concurso con unos croquis y renunció antes de que terminara la obra. Nunca volvió a verla terminada.","k":"Todas las 'velas' salen de una misma esfera: fue la solución geométrica para poder construirlas.","co":[-33.8571,151.2149],"img":1,"cr":"No machine-readable author provided. Roybb95~commonswiki assumed (based on copyr","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Sydney_Opera_House_Sails.jpg"},{"id":"pacificdesign","t":"Pacific Design Center","a":"César Pelli y Norma Merrick Sklarek (Gruen Associates)","y":1975,"yd":"1975","c":"West Hollywood","p":"Estados Unidos","per":"contemp","est":"Modernismo tardío","esc":"edificio","tags":["mujer","latam"],"d":"Conocido como 'la ballena azul'. Norma Sklarek, codirectora del proyecto, fue la primera mujer afroamericana con licencia de arquitecta en Nueva York y California.","k":"Una piel de vidrio azul opaco que envuelve el volumen como una sola pieza de color.","co":[34.0828,-118.3823],"img":1,"cr":"Benoît Prieur","lic":"CC0","src":"https://commons.wikimedia.org/wiki/File:Pacific_Design_Center-(West_Hollywood)_July_2023.jpg"},{"id":"pompidou","t":"Centro Pompidou","a":"Renzo Piano, Richard Rogers y Gianfranco Franchini","y":1977,"yd":"1971–1977","c":"París","p":"Francia","per":"contemp","est":"High-tech","esc":"edificio","tags":["pritzker"],"d":"Un museo con las tripas afuera: estructura, cañerías y escaleras en la fachada, para dejar el interior libre. Piano y Rogers tenían menos de 40 años.","k":"El código de colores: azul para el aire, verde para el agua, amarillo para la electricidad y rojo para la circulación.","co":[48.8606,2.3522],"img":1,"cr":"Stefan Drößler","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:L%C3%BCftungsrohre_Place_George_Pompidou_Paris.jpg"},{"id":"sancataldo","t":"Cementerio de San Cataldo","a":"Aldo Rossi con Gianni Braghieri","y":1978,"yd":"1971–(inconcluso)","c":"Módena","p":"Italia","per":"contemp","est":"Racionalismo / Tendenza","esc":"conjunto","tags":["pritzker"],"d":"Rossi lo pensó como una 'ciudad de los muertos' con formas arquetípicas. Ganó el Pritzker en 1990.","k":"El cubo rojo con ventanas cuadradas sin vidrios ni techo: una casa abandonada como símbolo.","img":1,"cr":"Massimocosti","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Cubo_di_Aldo_Rossi_del_cimitero_di_San_Cataldo.jpg"},{"id":"iimb","t":"IIM Bangalore","a":"Balkrishna Doshi (Stein, Doshi & Bhalla)","y":1983,"yd":"décadas de 1970–80","c":"Bangalore","p":"India","per":"contemp","est":"Modernismo indio","esc":"conjunto","tags":["pritzker"],"d":"Campus universitario inspirado en la ciudad de Fatehpur Sikri y en el templo de Madurai, entre jardines. Doshi trabajó con Le Corbusier y con Louis Kahn, y ganó el Pritzker en 2018.","k":"Los corredores de piedra cubiertos por pérgolas: calles en sombra donde se cruzan estudiantes y profesores.","img":1,"cr":"Magentic Manifestations","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:IIMB_Campus1.jpg"},{"id":"abteiberg","t":"Museo Abteiberg","a":"Hans Hollein","y":1982,"yd":"1972–1982","c":"Mönchengladbach","p":"Alemania","per":"contemp","est":"Posmodernismo","esc":"edificio","tags":["pritzker"],"d":"Museo en una ladera que se recorre como un paisaje de salas. Hollein ganó el Pritzker en 1985.","k":"Los techos en diente de sierra, como una fábrica, que llevan luz del norte a las salas.","img":1,"cr":"Gunnar Klack","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:2016-01-15-Museum-Abteiberg-Moenchengladbach-A.jpg"},{"id":"vietnam","t":"Monumento a los Veteranos de Vietnam","a":"Maya Lin","y":1982,"yd":"1982","c":"Washington D. C.","p":"Estados Unidos","per":"contemp","est":"Minimalismo / land art","esc":"ciudad","tags":["mujer"],"d":"Maya Lin ganó el concurso con 21 años, siendo estudiante. Un muro de granito negro con más de 58.000 nombres, hundido en el terreno como una herida.","k":"El granito pulido refleja a quien lee los nombres: el visitante se ve a sí mismo entre ellos.","co":[38.8911,-77.0478],"img":1,"cr":"David J. Jackson","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Vietnam_Memorial_Wall_with_Washington_Monument.jpg"},{"id":"stuttgart","t":"Neue Staatsgalerie Stuttgart","a":"James Stirling, Michael Wilford y Asociados","y":1984,"yd":"1977–1984","c":"Stuttgart","p":"Alemania","per":"contemp","est":"Posmodernismo","esc":"edificio","tags":["pritzker"],"d":"Ampliación del museo que mezcla citas clásicas con colores pop. Un camino público atraviesa el edificio.","k":"La rotonda abierta al cielo en el centro y las barandas tubulares rosa y azul.","co":[48.7802,9.1869],"img":1,"cr":"Immanuel Giel","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Neue_Staatsgalerie_Stuttgart_01.jpg"},{"id":"kakadu","t":"Centro de Visitantes Bowali, Kakadu","a":"Glenn Murcutt con Troppo Architects","y":1994,"yd":"1994","c":"Parque Nacional Kakadu","p":"Australia","per":"contemp","est":"Regionalismo australiano","esc":"edificio","tags":["pritzker"],"d":"Centro de visitantes en un parque nacional tropical, pensado para el calor y las lluvias del monzón. Murcutt trabaja solo y casi siempre en casas; ganó el Pritzker en 2002.","k":"Las celosías de listones y el gran techo de chapa que ventila y da sombra: 'tocar la tierra con suavidad'.","img":1,"cr":"Luke Durkin","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Facade_Slats_Kakadu_NP_Visitor_Centre_Glenn_Murcutt.jpg"},{"id":"hsbc","t":"Edificio HSBC de Hong Kong","a":"Norman Foster (Foster + Partners)","y":1985,"yd":"1979–1985","c":"Hong Kong","p":"China","per":"contemp","est":"High-tech","esc":"edificio","tags":["pritzker"],"d":"Un rascacielos sin núcleo central: la estructura cuelga de grandes mástiles. Al inaugurarse era el edificio más caro del mundo.","k":"El espejo solar en el atrio que refleja la luz del día hasta la plaza pública de planta baja.","co":[22.2803,114.1595],"img":1,"cr":"WiNG","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:HK_HSBC_Main_Building_2008.jpg"},{"id":"merida","t":"Museo Nacional de Arte Romano","a":"Rafael Moneo","y":1986,"yd":"1980–1986","c":"Mérida","p":"España","per":"contemp","est":"Contemporáneo","esc":"edificio","tags":["pritzker"],"d":"Construido sobre ruinas romanas, con ladrillo de la misma proporción que el romano. Moneo fue el primer español en ganar el Pritzker.","k":"La nave de grandes arcos de ladrillo repetidos, que hace de la luz y la masa un ambiente romano sin copiar nada.","co":[38.9173,-6.3399],"img":1,"cr":"Anual","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Nacional_de_Arte_Romano_2019An002.jpg"},{"id":"lloyds","t":"Edificio Lloyd's","a":"Richard Rogers","y":1986,"yd":"1978–1986","c":"Londres","p":"Reino Unido","per":"contemp","est":"High-tech","esc":"edificio","tags":["pritzker"],"d":"Ascensores, escaleras y baños están afuera, en torres de acero inoxidable, para dejar las oficinas libres. Es el edificio más joven con protección patrimonial máxima en Inglaterra.","k":"Los ascensores de vidrio que suben por el exterior, y los baños prefabricados enchufados a la fachada.","co":[51.5131,-0.0824],"img":1,"cr":"Stephen Richards","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Lloyds_building_taken_2011.jpg"},{"id":"orsay","t":"Museo de Orsay","a":"Gae Aulenti (interiores) con ACT Architecture","y":1986,"yd":"1980–1986","c":"París","p":"Francia","per":"contemp","est":"Reconversión","esc":"edificio","tags":["mujer"],"d":"Una antigua estación de tren de 1900 convertida en museo de arte del siglo XIX. Gae Aulenti diseñó las salas dentro de la gran nave.","k":"La nave de la estación conservada como calle central, con el gran reloj sobre la entrada.","co":[48.86,2.3265],"img":1,"cr":"zh:user:Munford","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Paris_Mus%C3%A9e_d%27Orsay_Grande_nef_centrale_01b.jpg"},{"id":"ima","t":"Instituto del Mundo Árabe","a":"Jean Nouvel con Architecture-Studio","y":1987,"yd":"1981–1987","c":"París","p":"Francia","per":"contemp","est":"High-tech","esc":"edificio","tags":["pritzker"],"d":"La fachada sur tiene 240 paneles con diafragmas metálicos que se abren y cierran según la luz. Combina tecnología y patrones geométricos árabes.","k":"Cada panel funciona como el diafragma de una cámara de fotos, inspirado en las celosías mashrabiya.","img":1,"cr":"Serge Melki from Indianapolis, USA","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Institut_du_Monde_Arabe_-_Mousharabieh_Eiffel_(3388328705).jpg"},{"id":"iglesialuz","t":"Iglesia de la Luz","a":"Tadao Ando","y":1989,"yd":"1988–1989","c":"Ibaraki, Osaka","p":"Japón","per":"contemp","est":"Minimalismo","esc":"edificio","tags":["pritzker"],"d":"Una pequeña iglesia de hormigón con un presupuesto mínimo. Ando fue boxeador y aprendió arquitectura por su cuenta.","k":"La cruz no es un objeto: es una ranura en el muro por donde entra la luz.","co":[34.8186,135.5369],"img":1,"cr":"The original uploader was Bujatt at English Wikipedia.","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Church_of_Light.JPG"},{"id":"louvre","t":"Pirámide del Louvre","a":"I. M. Pei","y":1989,"yd":"1984–1989","c":"París","p":"Francia","per":"contemp","est":"Modernismo tardío","esc":"pabellon","tags":["pritzker"],"d":"La nueva entrada del Louvre, muy criticada al principio. Lleva luz al gran vestíbulo subterráneo sin tapar las fachadas históricas.","k":"Usa vidrio extra transparente hecho especialmente para que no tenga el tono verde habitual.","co":[48.861,2.3359],"img":1,"cr":"Benh LIEU SONG (Flickr)","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Louvre_Museum_Wikimedia_Commons.jpg"},{"id":"santjordi","t":"Palau Sant Jordi","a":"Arata Isozaki","y":1990,"yd":"1985–1990","c":"Barcelona","p":"España","per":"contemp","est":"High-tech","esc":"edificio","tags":["pritzker"],"d":"Pabellón para los Juegos Olímpicos de Barcelona 1992. La cubierta se armó en el suelo y se levantó con gatos hidráulicos.","k":"La cúpula se levantó como un paraguas que se abre de abajo hacia arriba: el sistema 'pantadome'.","co":[41.3634,2.1526],"img":1,"cr":"Hosiawak","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Palau_Sant_Jordi_Barcelona_Catalonia.jpg"},{"id":"sainsbury","t":"Ala Sainsbury, National Gallery","a":"Robert Venturi y Denise Scott Brown","y":1991,"yd":"1987–1991","c":"Londres","p":"Reino Unido","per":"contemp","est":"Posmodernismo","esc":"edificio","tags":["pritzker","mujer"],"d":"Ampliación de la National Gallery que dialoga con la fachada clásica vecina. El Pritzker 1991 premió solo a Venturi y dejó afuera a su socia Denise Scott Brown, una omisión muy discutida.","k":"Las pilastras clásicas que se van espaciando y desaparecen a lo largo de la fachada.","co":[51.5089,-0.1283],"img":1,"cr":"Richard George","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:National_Gallery_London_Sainsbury_Wing_2006-04-17.jpg"},{"id":"hillside","t":"Hillside Terrace","a":"Fumihiko Maki","y":1992,"yd":"1969–1992","c":"Tokio","p":"Japón","per":"contemp","est":"Modernismo japonés","esc":"conjunto","tags":["pritzker"],"d":"Conjunto de viviendas, comercios y espacios culturales construido en siete etapas durante más de 20 años, en una misma calle. Maki ganó el Pritzker en 1993.","k":"Cada etapa responde a la anterior: la ciudad como algo que se completa con el tiempo.","img":1,"cr":"This Photo was taken by Supanut Arunoprayote. Feel free to use any of my images,","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Hillside_Terrace,_Building_C_20241020.jpg"},{"id":"bibnacional","t":"Biblioteca Nacional Mariano Moreno","a":"Clorindo Testa, Francisco Bullrich y Alicia Cazzaniga","y":1992,"yd":"1962–1992","c":"Buenos Aires","p":"Argentina","per":"contemp","est":"Brutalismo","esc":"edificio","tags":["latam","mujer"],"d":"Proyecto ganador de 1962, terminado treinta años después. La sala de lectura queda arriba, en un volumen suspendido sobre una plaza.","k":"El gran bloque sostenido por cuatro patas de hormigón, que deja libre el parque y lo mira desde lo alto.","img":1,"cr":"Gobierno de la Ciudad de Buenos Aires","lic":"CC BY 2.5 ar","src":"https://commons.wikimedia.org/wiki/File:Biblioteca_Nacional_BA.jpg"},{"id":"musica","t":"Ciudad de la Música","a":"Christian de Portzamparc","y":1995,"yd":"1990–1995","c":"París","p":"Francia","per":"contemp","est":"Contemporáneo","esc":"conjunto","tags":["pritzker"],"d":"Conservatorio, museo de la música y sala de conciertos en el parque de La Villette. Portzamparc fue el primer francés en ganar el Pritzker.","k":"Una calle interior en espiral que conecta las salas como notas en un recorrido.","co":[48.8897,2.3939],"img":1,"cr":"Olivier Bruchez","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Cit%C3%A9_de_la_musique,_%22We_Want_Miles%22_exhibit_1.jpg"},{"id":"mube","t":"Museo Brasileño de la Escultura (MuBE)","a":"Paulo Mendes da Rocha","y":1995,"yd":"1986–1995","c":"São Paulo","p":"Brasil","per":"contemp","est":"Brutalismo paulista","esc":"edificio","tags":["latam","pritzker"],"d":"El museo está casi todo bajo tierra; lo que se ve es una gran viga de hormigón de 60 m que da sombra a una plaza. Mendes da Rocha ganó el Pritzker en 2006.","k":"Una sola viga gigante que funciona como techo, sombra y marco del cielo.","img":1,"cr":"Arte Fora do Museu","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Museu_Brasileiro_da_Escultura_(MuBE),_Paulo_Mendes_da_Rocha_(5878309120).jpg"},{"id":"vals","t":"Termas de Vals","a":"Peter Zumthor","y":1996,"yd":"1993–1996","c":"Vals","p":"Suiza","per":"contemp","est":"Minimalismo","esc":"edificio","tags":["pritzker"],"d":"Baños termales semienterrados en la montaña, hechos con 60.000 lajas de cuarcita local. Zumthor diseña pocas obras y muy lentamente.","k":"Las ranuras de luz entre los bloques del techo, que caen como hilos sobre el agua.","img":1,"cr":"Micha L. Rieser","lic":"Attribution","src":"https://commons.wikimedia.org/wiki/File:Therme_Vals_facade,_Vals,_Graub%C3%BCnden,_Switzerland_-_20090809.jpg"},{"id":"bilbao","t":"Museo Guggenheim Bilbao","a":"Frank Gehry","y":1997,"yd":"1993–1997","c":"Bilbao","p":"España","per":"contemp","est":"Deconstructivismo","esc":"edificio","tags":["pritzker"],"d":"Su éxito transformó una ciudad industrial en crisis y dio nombre al 'efecto Bilbao'. Fue diseñado con un software de la industria aeronáutica.","k":"El titanio ondulado, de apenas medio milímetro de espesor, que cambia de color con el clima.","co":[43.2688,-2.9341],"img":1,"cr":"Naotake Murayama","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Museo_Guggenheim,_Bilbao_(31273245344).jpg"},{"id":"getty","t":"Getty Center","a":"Richard Meier","y":1997,"yd":"1984–1997","c":"Los Ángeles","p":"Estados Unidos","per":"contemp","est":"Modernismo tardío","esc":"conjunto","tags":["pritzker"],"d":"Campus de museos e investigación sobre una colina de Los Ángeles. Usa travertino traído de Italia y paneles de metal blanco.","k":"La grilla de 76 cm que ordena todo el conjunto, del piso a las fachadas.","co":[34.0775,-118.475],"img":1,"cr":"Derbrauni","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:2024_Getty_Center_07.jpg"},{"id":"tjibaou","t":"Centro Cultural Tjibaou","a":"Renzo Piano","y":1998,"yd":"1993–1998","c":"Numea","p":"Nueva Caledonia (Francia)","per":"contemp","est":"Contemporáneo","esc":"conjunto","tags":["pritzker"],"d":"Centro dedicado a la cultura canaca, inspirado en sus cabañas tradicionales. Piano ganó el Pritzker en 1998.","k":"Las 'cabañas' de listones de iroko curvados y abiertos que ventilan con el viento del Pacífico.","co":[-22.2564,166.4817],"img":1,"cr":"Fanny Schertzer","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Kanak_house.jpg"},{"id":"palaistokyo","t":"Palais de Tokyo","a":"Anne Lacaton y Jean-Philippe Vassal","y":2001,"yd":"2001 / 2012","c":"París","p":"Francia","per":"contemp","est":"Reconversión","esc":"edificio","tags":["pritzker","mujer"],"d":"Centro de arte contemporáneo en un palacio de 1937. Lacaton y Vassal casi no demolieron nada: limpiaron y dejaron la estructura en bruto.","k":"Su lema: 'nunca demoler'. Las paredes peladas y las instalaciones a la vista son la decisión del proyecto.","co":[48.8641,2.2971],"img":1,"cr":"Strobilomyces","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Palais_de_Tokyo_20030101w.JPG"},{"id":"gando","t":"Escuela Primaria de Gando","a":"Diébédo Francis Kéré","y":2001,"yd":"2001","c":"Gando","p":"Burkina Faso","per":"contemp","est":"Contemporáneo vernáculo","esc":"edificio","tags":["pritzker"],"d":"La escuela que Kéré construyó en su pueblo natal con la comunidad, ladrillos de tierra y un techo ventilado. Fue el primer africano en ganar el Pritzker, en 2022.","k":"Un techo de chap _Braga.JPG"},{"id":"quintamonroy","t":"Quinta Monroy","a":"Alejandro Aravena (Elemental)","y":2004,"yd":"2003–2004","c":"Iquique","p":"Chile","per":"contemp","est":"Vivienda incremental","esc":"conjunto","tags":["latam","pritzker"],"d":"Vivienda social donde se construyó 'la mitad de una buena casa' y las familias completaron la otra mitad. Aravena ganó el Pritzker en 2016.","k":"Los huecos entre las casas: espacio previsto para que cada familia crezca a su ritmo.","co":[-20.2268,-70.1362],"img":1,"cr":"HogRider00","lic":"CC0","src":"https://commons.wikimedia.org/wiki/File:Quinta_Monroy_Infill_Diagram.jpg"},{"id":"musica_porto","t":"Casa da Música","a":"Rem Koolhaas (OMA)","y":2005,"yd":"1999–2005","c":"Oporto","p":"Portugal","per":"contemp","est":"Contemporáneo","esc":"edificio","tags":["pritzker"],"d":"Sala de conciertos con forma de piedra tallada, sobre una plaza ondulada. Koolhaas ganó el Pritzker en 2000.","k":"La sala principal tiene vidrios ondulados en los dos extremos: se ve la ciudad durante el concierto.","co":[41.1589,-8.6307],"img":1,"cr":"xiquinhosilva from Cacau","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:86724-Porto_(49052540207).jpg"},{"id":"caterina","t":"Mercado de Santa Caterina","a":"Enric Miralles y Benedetta Tagliabue (EMBT)","y":2005,"yd":"1997–2005","c":"Barcelona","p":"España","per":"contemp","est":"Contemporáneo","esc":"edificio","tags":["mujer"],"d":"Renovación de un mercado del siglo XIX con un techo ondulado de colores. Tagliabue terminó la obra tras la muerte de Miralles en 2000.","k":"El techo de 325.000 piezas cerámicas en 67 colores, que reproduce frutas y verduras vistas desde arriba.","img":1,"cr":"Pere López Brosa","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Mercat_de_Santa_Caterina_-_20241105_171011.jpg"},{"id":"meti","t":"Escuela METI","a":"Anna Heringer y Eike Roswag","y":2006,"yd":"2005–2006","c":"Rudrapur","p":"Bangladés","per":"contemp","est":"Arquitectura de tierra","esc":"edi stados Unidos y después lo abandonó por el posmodernismo."],[1980,"Luis Barragán","México","casabarragan","Muros de color, agua y silencio: una arquitectura emocional hecha con pocos elementos."],[1981,"James Stirling","Reino Unido","stuttgart","Del brutalismo a un posmodernismo irónico, con citas clásicas y colores fuertes."],[1982,"Kevin Roche","Irlanda / Estados Unidos","ford","Sucesor de Eero Saarinen, diseñó grandes sedes corporativas y museos."],[1983,"I. M. Pei","China / Estados Unidos","louvre","Geometría precisa y museos que conviven con edificios históricos."],[1984,"Richard Meier","Estados Unidos","getty","Arquitectura blanca y luminosa, heredera de Le Corbusier."],[1985,"Hans Hollein","Austria","abteiberg","Arquitecto, artista y diseñador; figura clave del posmodernismo europeo."],[1986,"Gottfried Böhm","Alemania","neviges","Iglesias de hormigón esculpidas como montañas cristalinas."],[1987,"Kenzō Tange","Japón","yoyogi","Unió la tradición japonesa con el modernismo y formó a la generación metabolista."],[1988,"Oscar Niemeyer","Brasil","congreso","Curvas libres de hormigón: 'la curva que encuentro en las montañas y en el cuerpo de la mujer'."],[1988,"Gordon Bunshaft","Estados Unidos","lever","Diseñador de SOM, definió el rascacielos corporativo de vidrio."],[1989,"Frank Gehry","Canadá / Estados Unidos","bilbao","Formas libres de metal posibles gracias al diseño por computadora."],[1990,"Aldo Rossi","Italia","sancataldo","Teórico de 'La arquitectura de la ciudad': formas arquetípicas y memoria."],[1991,"Robert Venturi","Estados Unidos","venturi","Defendió la complejidad y la contradicción contra el purismo moderno."],[1992,"Álvaro Siza","Portugal","leca","Arquitectura blanca y sensible al lugar, desde Oporto al mundo."],[1993,"Fumihiko Maki","Japón","hillside","Pensó la ciudad como un conjunto de partes que crecen con el tiempo."],[1994,"Christian de Portzamparc","Francia","musica","Edificios como pequeñas ciudades, con calles y recorridos interiores."],[1995,"Tadao Ando","Japón","iglesialuz","Hormigón liso, luz y naturaleza; aprendió arquitectura por su cuenta."],[1996,"Rafael Moneo","España","merida","Cada proyecto responde a su lugar y a su historia, sin un estilo fijo."],[1997,"Sverre Fehn","Noruega","nordic","Poeta de la luz nórdica, la madera y el hormigón."],[1998,"Renzo Piano","Italia","tjibaou","De la tecnología del Pompidou a la artesanía de cada material."],[1999,"Norman Foster","Reino Unido","hsbc","Pionero del high-tech y de la eficiencia energética en grandes obras."],[2000,"Rem Koolhaas","Países Bajos","musica_porto","Pensador de la metrópolis contemporánea y fundador de OMA."],[2001,"Herzog & de Meuron","Suiza","elbphil","Investigan materiales y fachadas como si fueran una piel."],[2002,"Glenn Murcutt","Australia","kakadu","Trabaja solo, en casas que responden al clima y al paisaje."],[2003,"Jørn Utzon","Dinamarca","sydney","Autor de la Ópera de Sídney, obra cumbre del siglo XX."],[2004,"Zaha Hadid","Irak / Reino Unido","maxxi","Primera mujer en ganar el Pritzker; formas fluidas y dinámicas."],[2005,"Thom Mayne","Estados Unidos","cooper","Edificios fragmentados y en tensión, desde Morphosis."],[2006,"Paulo Mendes da Rocha","Brasil","mube","Brutalismo paulista: grandes luces de hormigón y espacio público."],[2007,"Richard Rogers","Reino Unido","lloyds","High-tech: estructura e instalaciones a la vista."],[2008,"Jean Nouvel","Francia","ima","Cada obra con una atmósfera propia, entre la luz y la tecnología."],[2009,"Peter Zumthor","Suiza","vals","Pocas obras, muy lentas, centradas en los materiales y los sentidos."],[2010,"Kazuyo Sejima y Ryue Nishizawa (SANAA)","Japón","rolex","Ligereza, transparencia y plantas que difuminan los límites."],[2011,"Eduardo Souto de Moura","Portugal","braga","Precisión y materiales del lugar, en diálogo con el paisaje."],[2012,"Wang Shu","China","ningbo","Construye con materiales recuperados y técnicas tradicionales chinas."],[2013,"Toyo Ito","Japón","sendai","Arquitectura ligera y fluida, inspirada en la naturaleza."],[2014,"Shigeru Ban","Japón","cardboard","Estructuras de cartón y refugios para víctimas de desastres."],[2015,"Frei Otto","Alemania","munich","Pionero de las estructuras livianas, tensadas y de membranas."],[2016,"Alejandro Aravena","Chile","quintamonroy","Vivienda social incremental y diseño participativo."],[2017,"RCR Arquitectes","España","soulages","Tres socios de Olot que unen paisaje, materia y lugar."],[2018,"Balkrishna Doshi","India","iimb","Modernismo adaptado a la India, con vivienda accesible."],[2019,"Arata Isozaki","Japón","santjordi","Puente entre Oriente y Occidente, con estilos siempre cambiantes."],[2020,"Yvonne Farrell y Shelley McNamara","Irlanda","utec","Grafton Architects: edificios generosos que hacen ciudad."],[2021,"Anne Lacaton y Jean-Philippe Vassal","Francia","palaistokyo","'Nunca demoler': transformar lo existente y ampliar el espacio de vida."],[2022,"Diébédo Francis Kéré","Burkina Faso","gando","Primer africano premiado; construye con su comunidad y con tierra."],[2023,"David Chipperfield","Reino Unido","neuesmuseum","Arquitectura sobria que restaura y continúa lo existente."],[2024,"Riken Yamamoto","Japón","yokosuka","Diseña para que la vivienda se abra a la comunidad."],[2025,"Liu Jiakun","China","xicun","Arquitectura de la vida cotidiana en la China contemporánea."],[2026,"Smiljan Radić","Chile","biobio","Obras frágiles y experimentales, entre la piedra, la membrana y el paisaje."]]}</script>
<script>
(function(){
"use strict";
const PWA = true;
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const DATA = JSON.parse(document.getElementById("data").textContent);
const W = DATA.works, BY = Object.fromEntries(W.map(w => [w.id, w]));
const PRZ = DATA.pritzker.map(([year, name, country, work, idea]) => ({year, name, country, work, idea}));
const PRZ_BY_WORK = {}; PRZ.forEach(p => (PRZ_BY_WORK[p.work] = PRZ_BY_WORK[p.work] || []).push(p));
const PER = {antigua:"Antigüedad", media:"Edad Media", moderna:"Edad Moderna", industrial:"Era industrial", s20:"Siglo XX", contemp:"Contemporánea"};
const PER_RANGE = {antigua:"hasta 500", media:"500–1400", moderna:"1400–1750", industrial:"1750–1914", s20:"1914–1970", contemp:"1970–hoy"};
const ESC = {objeto:"Objeto e interior", pabellon:"Casa o pabellón", edificio:"Edificio", conjunto:"Conjunto o infraestructura", ciudad:"Ciudad y paisaje"};
const TAG = {pritzker:"Pritzker", latam:"Latinoamérica", mujer:"Arquitectas"};
const COLS = [
  {key:"pritzker", name:"Premio Pritzker", sub:"Todos los laureados, de 1979 a 2026", f: w => w.tags.includes("pritzker"), cover:"bilbao", wide:true},
  {key:"latam", name:"Latinoamérica", sub:"Obras y arquitectxs de la región", f: w => w.tags.includes("latam"), cover:"masp"},
  {key:"mujer", name:"Arquitectas y diseñadoras", sub:"Obras con mujeres en la autoría", f: w => w.tags.includes("mujer"), cover:"rolex"},
  ...Object.keys(PER).map((k, i) => ({key:k, name:PER[k], sub:PER_RANGE[k], f: w => w.per === k, cover:["partenon","santasofia","rotonda","eiffel","savoye","vals"][i], group:"per"})),
  ...Object.keys(ESC).map((k, i) => ({key:"esc-"+k, name:ESC[k], sub:"Escala", f: w => w.esc === k, cover:["frankfurt","glasshouse","seagram","pontdugard","brasilia"][i], group:"esc"})),
];
const COL_BY = Object.fromEntries(COLS.map(c => [c.key, c]));

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayNum = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const TODAY = dayNum();
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const shuffle = (a, r = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, r = Math.random) => a[Math.floor(r() * a.length)];
const img = (w, cls = "", alt = true) => w && w.img ? `<img src="img/${w.id}.jpg" loading="lazy" decoding="async" class="${cls}" alt="${alt ? esc(w.t) : ""}">` : `<div class="ph ${cls}">sin foto libre</div>`;
const place = w => `${w.c}, ${w.p}`;
const credit = w => w.img ? `<a class="credit" href="${esc(w.src)}" target="_blank" rel="noopener">Foto: ${esc(w.cr || "Wikimedia Commons")}${w.lic ? " · " + esc(w.lic) : ""}</a>` : "";
const ICON = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17v.3"/></svg>',
};

/* ---------- estado y guardado ---------- */
const LS_KEY = "anden.v1";
const blank = () => ({v:1, upd:0, seen:{}, box:{}, favs:[], days:[], qa:{n:0, ok:0}, trip:null});
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
let remote = null, saveTimer = null, saving = false, dirty = false;
function save(){
  S.upd = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if (!remote || saving || !dirty) return;
  saving = true; dirty = false;
  try { await remote.set(JSON.parse(JSON.stringify(S))); } catch (e) { if (e && e.code === "invalid_argument") remote = null; }
  saving = false; if (dirty) flush();
}
(async function connect(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    remote = ref;
    if (snap.exists) {
      const d = snap.data();
      if ((d.upd || 0) > (S.upd || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(d))); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} renderAll(); }
      else if ((S.upd || 0) > (d.upd || 0)) { dirty = true; flush(); }
    } else if (S.upd) { dirty = true; flush(); }
    syncNote = "Tu progreso se guarda en tu cuenta y se sincroniza entre el celular y la compu.";
    if (current === "progreso") renderProgreso();
  } catch (e) {}
})();
let syncNote = "Tu progreso se guarda en este navegador.";

const isSeen = id => S.seen[id] != null;
function markSeen(id){ if (!isSeen(id)) { S.seen[id] = TODAY; save(); } }
const isFav = id => S.favs.includes(id);
function toggleFav(id){ S.favs = isFav(id) ? S.favs.filter(x => x !== id) : [id, ...S.favs]; save(); return isFav(id); }
const GAP = [0, 1, 2, 4, 8, 16, 32];
function review(id, ok){
  const b = S.box[id] || [0, TODAY];
  S.box[id] = [ok ? Math.min(b[0] + 1, 6) : 1, TODAY];
  S.qa.n++; if (ok) S.qa.ok++;
  save();
}
const due = id => { const b = S.box[id]; return !b || TODAY - b[1] >= GAP[b[0]]; };
function streak(){
  const set = new Set(S.days); let d = set.has(TODAY) ? TODAY : TODAY - 1, n = 0;
  while (set.has(d)) { n++; d--; }
  return n;
}

/* ---------- preguntas ---------- */
function distinct(answerOf, correct, pool, n, r){
  const seen = new Set([answerOf(correct)]), out = [];
  for (const w of shuffle(pool, r)) { const a = answerOf(w); if (!a || seen.has(a)) continue; seen.add(a); out.push(a); if (out.length === n) break; }
  return out;
}
function makeQ(id, r = Math.random, kind){
  const w = BY[id];
  const kinds = ["obra", "autor", "cuando", "donde"];
  if (PRZ_BY_WORK[id]) kinds.push("pritzker", "pritzker");
  if (w.img) kinds.push("obra");
  kind = kind || pick(kinds, r);
  if (!w.img && kind === "obra") kind = "autor";
  const near = W.filter(x => x.id !== id && (x.per === w.per));
  let q;
  if (kind === "obra") {
    const opts = [w.t, ...distinct(x => x.t, w, near.length >= 6 ? near : W.filter(x => x.id !== id), 3, r)];
    q = {kind, id, ask:"¿Qué obra es?", img:true, opts, ans:w.t};
  } else if (kind === "autor") {
    const pool = W.filter(x => x.id !== id && !x.a.includes(w.a.split(" ")[0]));
    const opts = [w.a, ...distinct(x => x.a, w, pool.filter(x => x.per === w.per).length >= 4 ? pool.filter(x => x.per === w.per) : pool, 3, r)];
    q = {kind, id, ask:"¿Quién la diseñó?", sub:w.t, img:true, opts, ans:w.a};
  } else if (kind === "cuando") {
    const gap = Math.max(25, Math.abs(w.y) * 0.12);
    const pool = W.filter(x => Math.abs(x.y - w.y) > gap);
    const picks = []; for (const x of shuffle(pool, r)) { if (picks.every(p => Math.abs(p.y - x.y) > gap) && !picks.some(p => p.yd === x.yd)) picks.push(x); if (picks.length === 3) break; }
    const opts = [w, ...picks].sort((a, b) => a.y - b.y).map(x => x.yd);
    q = {kind, id, ask:"¿Cuándo se construyó?", sub:w.t, img:true, opts, ans:w.yd, keep:true};
  } else if (kind === "donde") {
    const pool = W.filter(x => x.p !== w.p);
    q = {kind, id, ask:"¿Dónde está?", sub:w.t, img:true, opts:[place(w), ...distinct(place, w, pool, 3, r)], ans:place(w)};
  } else {
    const p = pick(PRZ_BY_WORK[id], r);
    if (r() < .5) {
      const yrs = new Set([p.year]); while (yrs.size < 4) { const y = 1979 + Math.floor(r() * 48); if ([...yrs].every(v => Math.abs(v - y) >= 3)) yrs.add(y); }
      q = {kind, id, ask:`¿En qué año ${/ y |&|\(/.test(p.name) ? "ganaron" : "ganó"} ${p.name} el Premio Pritzker?`, img:true, opts:[...yrs].sort().map(String), ans:String(p.year), keep:true};
    } else {
      const others = shuffle(PRZ.filter(x => x.name !== p.name && Math.abs(x.year - p.year) <= 14), r).slice(0, 3).map(x => x.name);
      q = {kind, id, ask:`¿Quién ganó el Premio Pritzker ${p.year}?`, img:false, opts:[p.name, ...others], ans:p.name};
    }
  }
  if (!q.keep) q.opts = shuffle(q.opts, r);
  return q;
}
function makeOrder(ids, r){
  const pool = ids.map(i => BY[i]).filter(Boolean);
  const chosen = []; for (const w of shuffle(pool, r)) { if (chosen.every(c => Math.abs(c.y - w.y) >= 5)) chosen.push(w); if (chosen.length === 3) break; }
  while (chosen.length < 3) { const w = pick(W, r); if (chosen.every(c => Math.abs(c.y - w.y) >= 20)) chosen.push(w); }
  return {kind:"orden", ids:shuffle(chosen.map(w => w.id), r), ans:chosen.slice().sort((a, b) => a.y - b.y).map(w => w.id), ask:"Ordená de la más antigua a la más nueva"};
}
function explain(w){ return `${w.t}: ${w.a}, ${w.yd}, ${place(w)}.`; }

/* ---------- viaje del día ---------- */
function buildTrip(){
  const r = rng(TODAY * 2654435761);
  const unseen = W.filter(w => !isSeen(w.id));
  const pool = unseen.length >= 5 ? unseen : W.filter(w => due(w.id));
  const pers = shuffle(Object.keys(PER), r), news = [];
  // una obra por época, y al menos una de cada colección destacada si hay
  for (const want of shuffle(["pritzker", "latam", "mujer"], r)) {
    const c = shuffle(pool.filter(w => w.tags.includes(want) && !news.includes(w.id)), r)[0]; if (c && news.length < 2) news.push(c.id);
  }
  for (const p of pers) { if (news.length >= 5) break; const c = shuffle(pool.filter(w => w.per === p && !news.includes(w.id)), r)[0]; if (c) news.push(c.id); }
  for (const w of shuffle(pool, r)) { if (news.length >= 5) break; if (!news.includes(w.id)) news.push(w.id); }
  const rev = shuffle(W.filter(w => isSeen(w.id) && !news.includes(w.id) && due(w.id)), r).map(w => w.id);
  const qa = i => makeQ(i, r);
  const [a, b, c, d, e] = shuffle(news, r);
  const steps = [
    {t:"w", id:a}, {t:"w", id:b}, {t:"q", q:qa(rev[0] || a)},
    {t:"w", id:c}, {t:"q", q:qa(b)}, {t:"w", id:d}, {t:"w", id:e},
    {t:"q", q:makeOrder(news, r)}, {t:"q", q:qa(rev[1] || d)}, {t:"q", q:qa(e)},
  ];
  return {day:TODAY, steps, at:0, ok:0, nq:0, news, done:false};
}
function trip(){ if (!S.trip || S.trip.day !== TODAY) { S.trip = buildTrip(); save(); } return S.trip; }

let quick = null; // repaso o quiz de colección, no se guarda
function startQuick(ids, title){
  const r = Math.random, chosen = shuffle(ids, r).slice(0, 6);
  const steps = chosen.slice(0, 5).map(i => ({t:"q", q:makeQ(i, r)}));
  if (chosen.length >= 3) steps.splice(2, 0, {t:"q", q:makeOrder(chosen, r)});
  quick = {title, steps, at:0, ok:0, nq:0, done:false, quick:true};
  openTrip();
}
function T(){ return quick || trip(); }

const tripEl = $("#trip");
let answered = null, orderSel = [];
function openTrip(){ tripEl.hidden = false; answered = null; orderSel = []; renderTrip(); }
function closeTrip(){ tripEl.hidden = true; quick = null; renderAll(); }
function stopsBar(t){
  return `<div class="stops" aria-hidden="true">${t.steps.map((s, i) => `${i ? `<i class="${i <= t.at ? "done" : ""}"></i>` : ""}<b class="${s.t === "q" ? "sq" : ""} ${i < t.at || t.done ? "done" : ""}"></b>`).join("")}</div>`;
}
function renderTrip(){
  const t = T();
  const head = `<div class="tbar"><div class="top"><button class="x" data-act="close" aria-label="Cerrar">${ICON.x}</button><span class="mono">${t.done ? "Destino" : `Parada ${t.at + 1} de ${t.steps.length}`}</span><span style="width:28px"></span></div>${stopsBar(t)}</div>`;
  if (t.done) {
    const s = streak();
    tripEl.innerHTML = head + `<div class="tbody"><div class="arrive">
      <span class="mono">${t.quick ? esc(t.title) : "Viaje de hoy"}</span>
      <h2>Llegaste a destino.</h2>
      <div class="stat3">
        ${t.quick ? "" : `<div><b>${t.news.length}</b><span class="mono">obras nuevas</span></div>`}
        <div><b>${t.ok}/${t.nq}</b><span class="mono">aciertos</span></div>
        <div><b>${s}</b><span class="mono">${s === 1 ? "día seguido" : "días seguidos"}</span></div>
      </div>
      ${t.quick ? "" : `<p class="read">Mañana te espera otro viaje con cinco obras nuevas. Las de hoy vuelven en preguntas de repaso dentro de unos días.</p>
      <div class="list">${t.news.map(i => rowHTML(BY[i])).join("")}</div>`}
    </div></div><div class="tfoot"><button class="btn" data-act="close">Volver al andén</button></div>`;
    return;
  }
  const st = t.steps[t.at];
  if (st.t === "w") {
    const w = BY[st.id]; markSeen(w.id);
    tripEl.innerHTML = head + `<div class="tbody">${fichaHTML(w)}</div>
      <div class="tfoot"><button class="favbtn ${isFav(w.id) ? "on" : ""}" data-act="fav" data-id="${w.id}" aria-label="Guardar en favoritas">${ICON.heart}</button><button class="btn" data-act="next">Siguiente parada</button></div>`;
  } else {
    tripEl.innerHTML = head + `<div class="tbody">${quizHTML(st.q)}</div>
      <div class="tfoot">${st.q.kind === "orden" && !answered ? `<button class="btn" data-act="check" ${orderSel.length < 3 ? "disabled" : ""}>Comprobar</button>` : `<button class="btn" data-act="next" ${answered ? "" : "disabled"}>${t.at === t.steps.length - 1 ? "Llegar a destino" : "Siguiente parada"}</button>`}</div>`;
  }
  $(".tbody", tripEl).scrollTop = 0;
}
const KINDLABEL = {obra:"Reconocer", autor:"Autoría", cuando:"Época", donde:"Lugar", pritzker:"Premio Pritzker", orden:"Línea de tiempo"};
function quizHTML(q){
  if (q.kind === "orden") {
    return `<div class="q"><span class="mono">Pregunta · ${KINDLABEL.orden}</span><h2>${q.ask}</h2>
      <p class="note">Tocá las obras en orden. Tocá de nuevo para deshacer.</p>
      <div class="order">${q.ids.map(i => { const w = BY[i], n = orderSel.indexOf(i);
        const right = answered && q.ans.indexOf(i);
        return `<button class="ord ${n >= 0 ? "sel" : ""}" data-act="ord" data-id="${i}" ${answered ? "disabled" : ""}>${img(w)}${n >= 0 ? `<span class="num">${n + 1}</span>` : ""}<span>${esc(w.t)}</span>${answered ? `<small>${esc(w.yd)} · ${right + 1}º</small>` : ""}</button>`; }).join("")}</div>
      ${answered ? verdictHTML(answered.ok, q.ans.map(i => `${BY[i].t} (${BY[i].yd})`).join(" → ")) : ""}</div>`;
  }
  const w = BY[q.id];
  return `<div class="q"><span class="mono">Pregunta · ${KINDLABEL[q.kind]}</span><h2>${esc(q.ask)}</h2>
    ${q.sub ? `<p class="qsub">${esc(q.sub)}</p>` : ""}
    ${q.img && w.img ? `<div class="qimg">${img(w, "", q.kind !== "obra")}</div>` : ""}
    <div class="opts">${q.opts.map((o, i) => {
      let cls = ""; if (answered) { if (o === q.ans) cls = "ok"; else if (o === answered.pick) cls = "bad"; }
      return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${answered ? "disabled" : ""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
    ${answered ? verdictHTML(answered.ok, explain(w)) : ""}</div>`;
}
function verdictHTML(ok, text){
  return `<div class="verdict ${ok ? "ok" : "bad"}" role="status"><b>${ok ? "¡Correcto!" : "No era esa."}</b><p>${esc(text)}</p></div>`;
}
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
tripEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const t = T(), st = t.steps[t.at], act = b.dataset.act;
  if (act === "close") return closeTrip();
  if (act === "open") return openSheet(b.dataset.id);
  if (act === "fav") { const on = toggleFav(b.dataset.id); b.classList.toggle("on", on); return; }
  if (act === "ans" && !answered) {
    const q = st.q, o = q.opts[+b.dataset.i], ok = o === q.ans;
    answered = {ok, pick:o}; t.nq++; if (ok) t.ok++; review(q.id, ok); buzz(ok ? 15 : [30, 40, 30]);
    if (!t.quick) save();
    return renderTrip();
  }
  if (act === "ord" && !answered) {
    const id = b.dataset.id; orderSel = orderSel.includes(id) ? orderSel.filter(x => x !== id) : [...orderSel, id];
    return renderTrip();
  }
  if (act === "check" && orderSel.length === 3) {
    const ok = orderSel.join() === st.q.ans.join(); answered = {ok}; t.nq++; if (ok) t.ok++;
    S.qa.n++; if (ok) S.qa.ok++; buzz(ok ? 15 : [30, 40, 30]); save();
    return renderTrip();
  }
  if (act === "next") {
    answered = null; orderSel = [];
    if (t.at >= t.steps.length - 1) {
      t.done = true;
      if (!t.quick && !S.days.includes(TODAY)) S.days.push(TODAY);
      if (quick && !S.days.includes(TODAY) && t.nq >= 5) S.days.push(TODAY);
    } else t.at++;
    save(); renderTrip();
  }
});

/* ---------- ficha ---------- */

    <div style="display:flex;gap:6px;flex-wrap:wrap">${w.tags.map(t => `<span class="tag y">${TAG[t]}</span>`).join("")}<span class="tag">${PER[w.per]}</span></div>
    <h2>${esc(w.t)}</h2>
    <div class="who">${esc(w.a)}</div>
    <dl class="facts">
      <div><dt>Año</dt><dd>${esc(w.yd)}</dd></div>
      <div><dt>Lugar</dt><dd>${esc(place(w))}</dd></div>
      <div><dt>Escala</dt><dd>${ESC[w.esc]}</dd></div>
      <div><dt>Estilo</dt><dd>${esc(w.est)}</dd></div>
      ${prz ? `<div style="grid-column:1/-1"><dt>Premio Pritzker</dt><dd>${prz.map(p => `${p.year} · ${esc(p.name)}`).join("<br>")}</dd></div>` : ""}
      ${w.co ? `<div style="grid-column:1/-1"><dt>Coordenadas</dt><dd style="font-family:var(--f-mono);font-weight:400;font-size:13px">${fmtCo(w.co)}</dd></div>` : ""}

function fmtCo([lat, lon]){ const f = (v, p, n) => `${Math.abs(v).toFixed(4)}° ${v >= 0 ? p : n}`; return `${f(lat, "N", "S")} · ${f(lon, "E", "O")}`; }
const sheet = $("#sheet");
function openSheet(id){
  const w = BY[id]; markSeen(id);
  sheet.innerHTML = `<div class="tbar"><div class="top"><button class="x" data-act="close" aria-label="Cerrar">${ICON.x}</button><span class="mono">${PER[w.per]}</span><span style="width:28px"></span></div></div>
    <div class="tbody">${fichaHTML(w)}</div>
    <div class="tfoot"><button class="favbtn ${isFav(id) ? "on" : ""}" data-act="fav" data-id="${id}" aria-label="Guardar en favoritas">${ICON.heart}</button><button class="btn ghost" data-act="close">Cerrar</button></div>`;
  sheet.hidden = false; $(".tbody", sheet).scrollTop = 0;
}
sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "close") { sheet.hidden = true; renderAll(); }
  if (b.dataset.act === "fav") b.classList.toggle("on", toggleFav(b.dataset.id));
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!sheet.hidden) { sheet.hidden = true; renderAll(); } else if (!tripEl.hidden) closeTrip(); } });

/* ---------- pestañas ---------- */
let current = "viaje";
const views = {viaje:$("#v-viaje"), explorar:$("#v-explorar"), colecciones:$("#v-colecciones"), progreso:$("#v-progreso")};
function go(tab, opts = {}){
  if (!views[tab]) tab = "viaje";
  current = tab;
  for (const k in views) views[k].hidden = k !== tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  if (tab === "viaje") renderViaje();
  if (tab === "explorar") renderExplorar(opts.filter);
  if (tab === "colecciones") renderColecciones(opts.col);
  if (tab === "progreso") renderProgreso();
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.tab); });
function renderAll(){ if (current === "explorar") refreshReels(); else go(current); }

/* ---------- inicio ---------- */
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"], MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function renderViaje(){
  const t = trip(), s = streak(), now = new Date();
  const dow = (now.getDay() + 6) % 7; // lunes = 0
  const week = Array.from({length:7}, (_, i) => TODAY - dow + i);
  const first = BY[t.news[0]];
  const label = t.done ? "Viaje completado" : t.at > 0 ? `Seguir viaje · parada ${t.at + 1}` : "Subir al tren";
  const lau = PRZ[(TODAY * 7) % PRZ.length], lw = BY[lau.work];
  const seenN = Object.keys(S.seen).length;
  views.viaje.innerHTML = `<div class="home pad">
    <div class="brand"><span class="mark">${$("#logo").innerHTML}<b>ANDÉN</b></span><span class="mono">${DIAS[now.getDay()]} ${now.getDate()} ${MESES[now.getMonth()]}</span></div>
    <div class="edge" aria-hidden="true"></div>
    <div class="streak"><span class="n">${s}</span><span><b style="font-size:18px">${s === 1 ? "día seguido" : "días seguidos"}</b><br><span class="note">${s ? "No cortes la racha: un viaje por día." : "Hacé tu primer viaje para empezar la racha."}</span></span>
      <div class="week">${week.map((d, i) => `<div><i class="${S.days.includes(d) ? "on" : ""} ${d === TODAY ? "today" : ""}"></i><span class="mono" style="font-size:10px">${"LMMJVSD"[i]}</span></div>`).join("")}</div>
    </div>
    <div class="trip">${first && first.img ? `<img src="img/${first.id}.jpg" alt="">` : ""}
      <div class="in">
        <span class="mono">Viaje de hoy · unos 10 minutos</span>
        <h2>${t.done ? "Llegaste a destino" : "5 obras, 5 preguntas"}</h2>
        ${stopsBar(t)}
        <span class="note">${t.news.map(i => esc(BY[i].t)).join(" · ")}</span>
        <button class="btn" data-act="trip">${label}</button>
      </div>
    </div>
    <div class="row2">
      <button class="btn ghost" data-act="review" ${seenN < 4 ? "disabled" : ""}>Repaso rápido</button>
      <button class="btn ghost" data-act="feed">Explorar obras</button>
    </div>
    ${seenN < 4 ? `<p class="note" style="margin-top:-12px">El repaso se habilita cuando viste al menos 4 obras.</p>` : ""}
    <div class="card laureate">
      <div><span class="mono">Pritzker del día</span><div class="yr" style="margin-top:8px">${lau.year}</div><h3>${esc(lau.name)}</h3><span class="note">${esc(lau.country)}</span><p>${esc(lau.idea)}</p></div>
      <button data-act="open" data-id="${lw.id}" aria-label="Ver ${esc(lw.t)}">${img(lw)}</button>
    </div>
    <div>
      <div class="sec-h"><h3 style="font-size:19px">Tus colecciones</h3><button class="mono" data-act="cols">Ver todas</button></div>
      <div class="bars">${["pritzker", "latam", "mujer"].map(k => barHTML(COL_BY[k])).join("")}</div>
    </div>
    ${PWA && !STANDALONE ? `<div class="install"><b>Instalala en tu celular</b><span class="note">En iPhone: abrí esta página en Safari, tocá Compartir y elegí “Agregar a inicio”. En Android: menú de Chrome y “Instalar app”. Después funciona sin conexión.</span></div>` : ""}
  </div>`;
}
function colStats(c){ const ws = W.filter(c.f); return {ws, n:ws.length, seen:ws.filter(w => isSeen(w.id)).length}; }
function barHTML(c){ const s = colStats(c); return `<div class="bar"><span>${c.name}</span><em>${s.seen}/${s.n}</em><div class="track"><i style="width:${(100 * s.seen / s.n).toFixed(1)}%"></i></div></div>`; }
views.viaje.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "trip") openTrip();
  if (a === "review") startQuick(Object.keys(S.seen).filter(id => BY[id]), "Repaso rápido");
  if (a === "feed") go("explorar");
  if (a === "cols") go("colecciones");
  if (a === "open") openSheet(b.dataset.id);
});

/* ---------- explorar ---------- */
let feedFilter = "todo", feedOrder = null, io = null;
const FILTERS = [["todo", "Todo"], ["nuevas", "Sin ver"], ["pritzker", "Pritzker"], ["latam", "Latinoamérica"], ["mujer", "Arquitectas"], ...Object.entries(PER), ...Object.entries(ESC).map(([k, v]) => ["esc-" + k, v])];
function feedList(){
  if (!feedOrder) feedOrder = shuffle(W.map(w => w.id));
  const f = feedFilter === "todo" ? () => true : feedFilter === "nuevas" ? w => !isSeen(w.id) : COL_BY[feedFilter].f;
  return feedOrder.map(i => BY[i]).filter(f);
}
function reelHTML(w){
  return `<article class="reel" data-id="${w.id}">${img(w)}<div class="shade"></div>
    <div class="txt">
      <span class="meta">${esc(w.yd)} · ${esc(place(w))}</span>
      <h2>${esc(w.t)}</h2>
      <span class="who">${esc(w.a)}</span>
      <div class="tags">${w.tags.map(t => `<span class="tag y">${TAG[t]}</span>`).join("")}<span class="tag">${PER[w.per]}</span><span class="tag">${ESC[w.esc]}</span></div>
      ${credit(w)}
    </div>
    <div class="side">
      <button data-act="fav" class="${isFav(w.id) ? "on" : ""}" aria-label="Guardar">${ICON.heart}<span>Guardar</span></button>
      <button data-act="info" aria-label="Ver ficha">${ICON.info}<span>Ficha</span></button>
      <button data-act="q" aria-label="Pregunta sobre esta obra">${ICON.quiz}<span>Pregunta</span></button>
    </div>
  </article>`;
}
function renderExplorar(filter){
  if (filter) { feedFilter = filter; }
  const list = feedList();
  views.explorar.innerHTML = `<div class="chips" role="toolbar" aria-label="Filtros">${FILTERS.map(([k, v]) => `<button class="chip" data-f="${k}" aria-pressed="${k === feedFilter}">${v}</button>`).join("")}</div>
    <div class="feed">${list.length ? list.map(reelHTML).join("") : `<div class="pad" style="padding-top:90px"><p class="empty">Ya viste todas las obras de este filtro. Probá con otro o repasalas en Colecciones.</p></div>`}</div>
    ${list.length && !S.hintFeed ? `<div class="hint">Deslizá hacia arriba · doble toque para guardar</div>` : ""}`;
  const chip = $(`.chip[aria-pressed="true"]`, views.explorar); if (chip) chip.scrollIntoView({inline:"center", block:"nearest"});
  observeReels();
}
function observeReels(){
  if (io) io.disconnect();
  const timers = new Map();
  io = new IntersectionObserver(entries => entries.forEach(en => {
    const id = en.target.dataset.id;
    if (en.isIntersecting) timers.set(id, setTimeout(() => { markSeen(id); if (!S.hintFeed) { S.hintFeed = 1; const h = $(".hint", views.explorar); if (h) h.remove(); } }, 1500));
    else { clearTimeout(timers.get(id)); timers.delete(id); }
  }), {threshold:.6});
  views.explorar.querySelectorAll(".reel").forEach(r => io.observe(r));
}
function refreshReels(){ views.explorar.querySelectorAll(".reel").forEach(r => { const b = $('[data-act="fav"]', r); if (b) b.classList.toggle("on", isFav(r.dataset.id)); }); }
let lastTap = 0;
views.explorar.addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (c) { feedFilter = c.dataset.f; return renderExplorar(); }
  const reel = e.target.closest(".reel"); if (!reel) return;
  const id = reel.dataset.id, b = e.target.closest("[data-act]");
  if (b) {
    if (b.dataset.act === "fav") b.classList.toggle("on", toggleFav(id));
    if (b.dataset.act === "info") openSheet(id);
    if (b.dataset.act === "q") { quick = {title:"Pregunta", steps:[{t:"q", q:makeQ(id)}], at:0, ok:0, nq:0, done:false, quick:true}; openTrip(); }
    return;
  }
  if (e.target.closest("a")) return;
  const now = Date.now();
  if (now - lastTap < 320) {
    if (!isFav(id)) toggleFav(id);
    const fb = $('[data-act="fav"]', reel); if (fb) fb.classList.add("on");
    const s = document.createElement("div"); s.innerHTML = ICON.heart; const svg = s.firstChild; svg.classList.add("burst"); reel.appendChild(svg); setTimeout(() => svg.remove(), 750);
    lastTap = 0;
  } else lastTap = now;
});

/* ---------- colecciones ---------- */
function rowHTML(w){
  return `<button class="li" data-act="open" data-id="${w.id}">${img(w)}<span style="min-width:0"><b>${esc(w.t)}${isSeen(w.id) ? "" : `<span class="dot" title="Sin ver"></span>`}</b><small>${esc(w.a)}</small></span><span class="y">${esc(shortYear(w))}</span></button>`;
}
function shortYear(w){ if (w.yd.length <= 12) return w.yd; const c = /^(c\.|s\.)/.test(w.yd) ? "c. " : ""; return c + (w.y < 0 ? -w.y + " a.C." : w.y); }
function renderColecciones(colKey){
  const v = views.colecciones;
  if (!colKey) {
    const tile = c => { const s = colStats(c), cov = BY[c.cover];
      return `<button class="coltile ${c.wide ? "wide" : ""}" data-col="${c.key}">${img(cov, "", false)}<span class="in"><b>${c.name}</b><em>${s.seen} de ${s.n} vistas · ${esc(c.sub)}</em><span class="track"><i style="width:${(100 * s.seen / s.n).toFixed(1)}%"></i></span></span></button>`; };
    v.innerHTML = `<div class="cols pad">
      <div><span class="mono">Colecciones</span><h1 style="font-size:32px;margin-top:6px">Elegí por dónde seguir</h1></div>
      <div class="colgrid">${COLS.filter(c => !c.group).map(tile).join("")}</div>
      <div><div class="sec-h"><h3 style="font-size:19px">Por época</h3></div><div class="colgrid">${COLS.filter(c => c.group === "per").map(tile).join("")}</div></div>
      <div><div class="sec-h"><h3 style="font-size:19px">Por escala</h3><span class="mono">de la silla a la ciudad</span></div><div class="colgrid">${COLS.filter(c => c.group === "esc").map(tile).join("")}</div></div>
    </div>`;
    v.scrollTop = 0; return;
  }
  const c = COL_BY[colKey], s = colStats(c);
  const body = colKey === "pritzker"
    ? PRZ.slice().reverse().map(p => { const w = BY[p.work]; return `<button class="prow" data-act="open" data-id="${w.id}"><span class="yr">${p.year}</span><span style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.country)} · ${esc(w.t)}</small><p>${esc(p.idea)}</p></span>${img(w)}</button>`; }).join("")
    : s.ws.slice().sort((a, b) => a.y - b.y).map(rowHTML).join("");
  v.innerHTML = `<div class="colhead pad">
      <button class="back" data-act="cols">${ICON.back} Colecciones</button>
      <span class="mono">${esc(c.sub)}</span>
      <h1 style="font-size:32px">${c.name}</h1>
      ${barHTML(c).replace(c.name, "Vistas")}
      <div class="row2"><button class="btn" data-act="cquiz" data-col="${c.key}">Quiz de 6 preguntas</button><button class="btn ghost" data-act="cfeed" data-col="${c.key}">Ver en el feed</button></div>
      ${colKey === "pritzker" ? `<p class="note">${PRZ.length} laureados en ${new Set(PRZ.map(p => p.year)).size} ediciones. Tocá cada fila para ver una obra clave.</p>` : `<p class="note">${s.n} obras, de la más antigua a la más nueva. El punto amarillo marca las que todavía no viste.</p>`}
    </div>
    <div class="list pad" style="padding-bottom:28px">${body}</div>`;
  v.scrollTop = 0;
}
views.colecciones.addEventListener("click", e => {
  const t = e.target.closest("[data-col],[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "open") return openSheet(t.dataset.id);
  if (a === "cols") return renderColecciones();
  if (a === "cquiz") { const c = COL_BY[t.dataset.col]; return startQuick(W.filter(c.f).map(w => w.id), "Quiz · " + c.name); }
  if (a === "cfeed") return go("explorar", {filter:t.dataset.col});
  if (t.dataset.col) renderColecciones(t.dataset.col);
});

/* ---------- progreso ---------- */
let confirmReset = false;
function renderProgreso(){
  const s = streak(), seen = Object.keys(S.seen).filter(id => BY[id]).length;
  const learned = Object.values(S.box).filter(b => b[0] >= 3).length;
  const start = TODAY - 27 - ((new Date().getDay() + 6) % 7 === 6 ? 0 : 0);
  const days = Array.from({length:28}, (_, i) => start + i);
  views.progreso.innerHTML = `<div class="prog pad">
    <div><span class="mono">Progreso</span><h1 style="font-size:32px;margin-top:6px">Tu recorrido</h1></div>
    <div class="big4">
      <div><b>${s}</b><span class="mono">racha actual</span></div>
      <div><b>${S.days.length}</b><span class="mono">viajes hechos</span></div>
      <div><b>${seen}<span style="font-size:18px;color:var(--muted)">/${W.length}</span></b><span class="mono">obras vistas</span></div>
      <div><b>${S.qa.n ? Math.round(100 * S.qa.ok / S.qa.n) : 0}%</b><span class="mono">aciertos (${S.qa.n})</span></div>
    </div>
    <div><div class="sec-h"><h3 style="font-size:19px">Últimos 28 días</h3><span class="mono">${learned} obras aprendidas</span></div>
      <div class="cal">${days.map(d => `<i class="${S.days.includes(d) ? "on" : ""} ${d === TODAY ? "today" : ""}" title="${d === TODAY ? "Hoy" : ""}"></i>`).join("")}</div>
      <p class="note" style="margin-top:8px">Una obra cuenta como aprendida después de acertarla tres veces en días distintos.</p></div>
    <div><div class="sec-h"><h3 style="font-size:19px">Guardadas</h3><span class="mono">${S.favs.length}</span></div>
      ${S.favs.length ? `<div class="favs">${S.favs.filter(id => BY[id]).map(id => `<button data-act="open" data-id="${id}" aria-label="${esc(BY[id].t)}">${img(BY[id])}</button>`).join("")}</div>` : `<p class="empty">Todavía no guardaste obras. En Explorar, tocá dos veces una foto para guardarla.</p>`}</div>
    <div class="bars">${COLS.filter(c => c.group !== "esc").map(barHTML).join("")}</div>
    ${PWA && !STANDALONE ? `<div class="install"><b>Instalala en tu celular</b><span class="note">En iPhone: abrí esta página en Safari, tocá Compartir y elegí “Agregar a inicio”. En Android: menú de Chrome y “Instalar app”. Después funciona sin conexión.</span></div>` : ""}
    <p class="note">${syncNote}</p>
    ${confirmReset ? `<div class="confirm"><b>¿Borrar todo tu progreso?</b><span class="note">Se pierden la racha, las obras vistas y las guardadas. No se puede deshacer.</span><div class="row2"><button class="btn" data-act="reset-yes">Borrar progreso</button><button class="btn ghost" data-act="reset-no">Cancelar</button></div></div>` : `<button class="danger" data-act="reset" style="align-self:flex-start">Borrar mi progreso</button>`}
    <p class="note">Fotos de Wikimedia Commons, con sus autores y licencias en cada imagen. Datos verificados con Wikidata y Wikipedia.</p>
  </div>`;
}
views.progreso.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "open") return openSheet(b.dataset.id);
  if (a === "reset") { confirmReset = true; return renderProgreso(); }
  if (a === "reset-no") { confirmReset = false; return renderProgreso(); }
  if (a === "reset-yes") { confirmReset = false; S = blank(); save(); renderProgreso(); }
});

const start = (location.hash || "").slice(1);
go(views[start] ? start : "viaje");
})();
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
