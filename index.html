<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Andén Arquitectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<meta name="description" content="Un viaje diario de 10 minutos por la arquitectura: 147 obras de la Antigüedad a hoy, preguntas, racha y colecciones de Pritzker, Latinoamérica y arquitectas.">
<meta name="theme-color" content="#ebd3a2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Andén">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<style>/* Layout: una sola pantalla con pestañas abajo. Combinación n.º 184 de Sanzo Wada:
   Ivory Buff de fondo, Spinel Red para la tipografía (en su tono profundo, para que se lea) y
   Light Grayish Olive para subtítulos y detalles. Papel claro, como una lámina de dibujo. */
:root{
  --buff:#ebd3a2;            /* Ivory Buff: fondos */
  --spinel:#f27291;          /* Spinel Red exacto: acentos grandes, línea de paradas, ícono */
  --olive:#848061;           /* Light Grayish Olive exacto: líneas y detalles */
  --ink:#9c2a48;             /* Spinel Red profundo: tipografía (contraste 5:1 sobre el fondo) */
  --olive-ink:#5f5c43;       /* oliva profundo: subtítulos (contraste 4,6:1) */
  --bg:var(--buff);
  --surface:#f2e2bf;         /* buff más claro para tarjetas */
  --raise:#dfc690;           /* buff más oscuro para pistas y huecos */
  --line:rgba(132,128,97,.42);
  --fg:var(--ink);
  --muted:var(--olive-ink);
  --accent:var(--spinel);
  --on-ink:var(--buff);
  --ok:var(--olive);
  --bad:var(--spinel);
  --shade-top:rgba(235,211,162,.0);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-display);font-stretch:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit}
img{display:block;max-width:100%}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding-left:var(--gut-l);padding-right:var(--gut-r)}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800;font-stretch:118%;line-height:1.05;color:var(--ink)}

/* ---------- pestañas ---------- */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-left:var(--gut-l);padding-right:var(--gut-r)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding-block:9px 8px;color:var(--olive-ink);font-size:11px;font-weight:600;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--ink)}
nav.tabs button[aria-current="page"]::after{content:"";width:18px;height:3px;background:var(--spinel);margin-top:1px}

/* ---------- inicio ---------- */
.home{display:flex;flex-direction:column;gap:22px;padding-block:18px 28px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand .mark{display:flex;align-items:center;gap:10px}
.brand .mark svg{width:40px;height:40px;border-radius:9px}
.brand b{font-size:26px;font-weight:900;font-stretch:125%;letter-spacing:.04em;color:var(--ink)}
.edge{height:6px;background:repeating-linear-gradient(90deg,var(--spinel) 0 10px,transparent 10px 13px);border-radius:1px}
.streak{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.streak .n{font-size:64px;font-weight:900;font-stretch:125%;line-height:.85;font-variant-numeric:tabular-nums;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;grid-column:1/-1;margin-top:10px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px}
.week i{display:block;width:100%;height:8px;border-radius:1px;background:var(--raise)}
.week i.on{background:var(--spinel)}
.week i.today{outline:1px solid var(--ink);outline-offset:2px}
.trip{position:relative;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.trip>img{width:100%;height:170px;object-fit:cover}
.trip .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.trip h2{font-size:30px}
.stops{display:flex;align-items:center;gap:0;margin:6px 0 2px}
.stops i{flex:1;height:3px;background:var(--line)}
.stops i.done{background:var(--spinel)}
.stops b{width:11px;height:11px;border-radius:50%;border:2px solid var(--olive);background:var(--bg);flex:none}
.stops b.done{border-color:var(--spinel);background:var(--spinel)}
.stops b.sq{border-radius:1px;transform:rotate(45deg) scale(.9)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:4px;background:var(--ink);color:var(--on-ink);font-weight:800;font-stretch:112%;font-size:16px;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--olive)}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:14.5px;font-stretch:100%;padding:0 10px;white-space:nowrap}
.card{background:var(--surface);border-radius:6px;padding:16px;border:1px solid var(--line)}
.laureate{display:grid;grid-template-columns:1fr 88px;gap:14px;align-items:center}
.laureate .yr{font-family:var(--f-mono);font-size:30px;font-weight:500;color:var(--ink);line-height:1}
.laureate h3{font-size:19px;margin-top:6px}
.laureate p{font-family:var(--f-read);font-size:15px;margin:6px 0 0;color:var(--olive-ink)}
.laureate img{width:88px;height:88px;object-fit:cover;border-radius:4px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.bar span{font-weight:700}
.bar em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:4px;background:var(--raise);border-radius:2px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--spinel)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.note{font-size:13px;color:var(--muted);margin:0}

/* ---------- explorar (feed) ---------- */
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--raise)}
.reel>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .shade{position:absolute;inset:0;background:linear-gradient(rgba(235,211,162,.55),rgba(235,211,162,0) 14%,rgba(235,211,162,0) 44%,rgba(235,211,162,.9) 64%,var(--buff) 80%)}
.reel .txt{position:absolute;left:0;right:68px;bottom:0;padding-left:var(--gut-l);padding-bottom:22px;display:flex;flex-direction:column;gap:6px}
.reel h2{font-size:30px}
.reel .who{font-family:var(--f-read);font-style:italic;font-size:16px;color:var(--ink)}
.reel .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive-ink)}
.reel .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid var(--olive);color:var(--olive-ink)}
.tag.y{background:var(--spinel);border-color:var(--spinel);color:#3b0d1a}
.side{position:absolute;right:max(10px, env(safe-area-inset-right, 0px));bottom:26px;display:flex;flex-direction:column;gap:18px;align-items:center;color:var(--ink)}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
.side svg{width:30px;height:30px}
.side .on svg{color:var(--spinel);fill:var(--spinel)}
.credit{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.02em;color:var(--olive-ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.chips{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px var(--gut-r) 12px var(--gut-l)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:rgba(235,211,162,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);font-weight:700;font-size:13px;border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--buff);border-color:var(--ink)}
.burst{position:absolute;left:50%;top:40%;width:110px;height:110px;margin:-55px 0 0 -55px;color:var(--spinel);fill:var(--spinel);pointer-events:none;animation:burst .7s ease-out forwards}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
.hint{position:absolute;left:50%;top:64px;white-space:nowrap;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--buff);background:var(--ink);padding:6px 10px;border-radius:2px;pointer-events:none}

/* ---------- colecciones ---------- */
.cols{display:flex;flex-direction:column;gap:26px;padding-block:18px 28px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.coltile{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:6px;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line)}
.coltile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coltile .in{position:absolute;inset:auto 0 0 0;padding:12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(rgba(242,226,191,0),rgba(242,226,191,.95) 28%,var(--surface))}
.coltile b{font-size:17px;font-weight:800;font-stretch:112%;line-height:1.1;color:var(--ink)}
.coltile .track{height:3px;background:var(--raise)}
.coltile .track i{display:block;height:100%;background:var(--spinel)}
.coltile em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--olive-ink)}
.coltile.wide{grid-column:1/-1;aspect-ratio:16/9}
.coltile.wide b{font-size:24px}
.colhead{display:flex;flex-direction:column;gap:12px;padding-block:16px 8px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--olive-ink);font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li img,.li .ph{width:64px;height:64px;object-fit:cover;border-radius:3px;background:var(--raise)}
.li b{display:block;font-weight:700;line-height:1.2;color:var(--ink)}
.li small{display:block;color:var(--olive-ink);font-size:13px;margin-top:2px;min-width:0}
.li .y{font-family:var(--f-mono);font-size:12px;color:var(--olive-ink);text-align:right;font-variant-numeric:tabular-nums}
.li .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--spinel);margin-left:6px;vertical-align:middle}
.prow{display:grid;grid-template-columns:58px 1fr 56px;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.prow .yr{font-family:var(--f-mono);font-size:17px;font-weight:500;color:var(--ink);padding-top:2px}
.prow b{display:block;font-size:16px;font-weight:800;font-stretch:110%;line-height:1.15;color:var(--ink)}
.prow small{display:block;font-size:12px;color:var(--olive-ink);margin-top:2px}
.prow p{font-family:var(--f-read);font-size:14.5px;margin:6px 0 0;line-height:1.4;color:var(--olive-ink)}
.prow img{width:56px;height:56px;object-fit:cover;border-radius:3px}

/* ---------- ficha de obra ---------- */
.ficha{display:flex;flex-direction:column;gap:14px}
.photo{position:relative;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l));background:var(--raise)}
.photo img{width:100%;height:min(48vh,440px);object-fit:cover}
.photo .credit{position:absolute;left:var(--gut-l);right:var(--gut-r);bottom:0;padding:3px 0;background:linear-gradient(rgba(235,211,162,0),rgba(235,211,162,.9))}
.photo .ph{height:min(40vh,360px)}
.ficha h2{font-size:30px}
.ficha .who{font-family:var(--f-read);font-style:italic;font-size:17px;margin-top:-6px;color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0;padding:12px 0;border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive-ink)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:14.5px;color:var(--ink)}
.read{font-family:var(--f-read);font-size:17.5px;line-height:1.55;margin:0;max-width:62ch;color:var(--ink)}
.look{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--surface);border-radius:4px;border:1px solid var(--line)}
.look .mono{color:var(--ink)}
.look p{margin:0;font-family:var(--f-read);font-size:16.5px;line-height:1.5;color:var(--olive-ink)}
.ph{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,var(--raise) 0 2px,var(--surface) 2px 12px);color:var(--olive-ink);font-family:var(--f-mono);font-size:11px}

/* ---------- pantalla del viaje ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.overlay[hidden]{display:none}
.tbar{display:flex;flex-direction:column;gap:8px;padding:10px var(--gut-r) 10px var(--gut-l);border-bottom:1px solid var(--line)}
.tbar .top{display:flex;justify-content:space-between;align-items:center}
.x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-left:-8px;color:var(--ink)}
.x svg{width:22px;height:22px}
.tbody{flex:1;min-height:0;overflow-y:auto;padding:0 var(--gut-r) 20px var(--gut-l)}
.tfoot{padding:10px var(--gut-r) 12px var(--gut-l);border-top:1px solid var(--line);display:flex;gap:10px}
.tfoot .btn{flex:1}
.favbtn{width:50px;min-height:50px;border:1px solid var(--olive);border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.favbtn svg{width:24px;height:24px}
.favbtn.on svg{color:var(--spinel);fill:var(--spinel)}
.q{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.q h2{font-size:25px}
.qsub{margin:-6px 0 0;font-family:var(--f-read);font-style:italic;font-size:19px;color:var(--olive-ink)}
.q .qimg{margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l))}
.q .qimg img{width:100%;height:min(34vh,300px);object-fit:cover}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:4px;border:1px solid var(--olive);background:var(--surface);text-align:left;font-weight:600;font-size:15.5px;line-height:1.25;color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--olive-ink);flex:none;width:14px}
.opt.ok{border:2px solid var(--olive);background:color-mix(in srgb,var(--olive) 30%,var(--surface))}
.opt.bad{border:2px solid var(--spinel);background:color-mix(in srgb,var(--spinel) 28%,var(--surface))}
.opt:disabled{cursor:default}
.verdict{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:4px;background:var(--surface);border-left:4px solid var(--olive)}
.verdict.bad{border-left-color:var(--spinel)}
.verdict b{font-size:17px}
.verdict.ok b{color:var(--olive-ink)} .verdict.bad b{color:var(--ink)}
.verdict p{margin:0;font-family:var(--f-read);font-size:15.5px;color:var(--ink)}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ord{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left}
.ord img,.ord .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;border:3px solid transparent}
.ord.sel img,.ord.sel .ph{border-color:var(--spinel)}
.ord .num{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--buff);font-family:var(--f-mono);font-weight:500;display:flex;align-items:center;justify-content:center}
.ord span{font-size:12.5px;font-weight:700;line-height:1.2;color:var(--ink)}
.ord small{font-family:var(--f-mono);font-size:11px;color:var(--olive-ink)}
.arrive{display:flex;flex-direction:column;gap:18px;padding-top:28px}
.arrive h2{font-size:40px;font-stretch:125%}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{background:var(--surface);border-radius:4px;padding:12px;border:1px solid var(--line)}
.stat3 b{display:block;font-size:30px;font-weight:900;font-stretch:120%;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- progreso ---------- */
.prog{display:flex;flex-direction:column;gap:24px;padding-block:18px 28px}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big4 div{background:var(--surface);border-radius:6px;padding:14px;border:1px solid var(--line)}
.big4 b{display:block;font-size:36px;font-weight:900;font-stretch:122%;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:2px;background:var(--raise)}
.cal i.on{background:var(--spinel)}
.cal i.today{outline:1px solid var(--ink);outline-offset:1px}
.favs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.favs button{aspect-ratio:1;max-width:100%;overflow:hidden;background:var(--raise)}
.favs img{width:100%;height:100%;object-fit:cover}
.empty{color:var(--olive-ink);font-family:var(--f-read);font-size:15.5px;margin:0}
.danger{color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--spinel);border-radius:4px}
.install{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px dashed var(--olive);border-radius:6px}
.install b{color:var(--ink)}

@media (min-width:760px){
  .home,.cols,.prog,.colhead,.list{max-width:720px;margin-inline:auto;width:100%}
  .tbody>*{max-width:680px;margin-inline:auto}
  .photo{margin:0}
  .photo img{border-radius:4px}
  .q .qimg{margin:0}
}

<script id="data" type="application/json">{"works":[{"id":"giza","t":"Gran Pirámide de Guiza","a":"Hemiunu (atribuido)","y":-2560,"yd":"c. 2560 a.C.","c":"Guiza","p":"Egipto","per":"antigua","est":"Egipcio","esc":"conjunto","tags":[],"d":"Tumba del faraón Keops y durante casi 4.000 años la construcción más alta del mundo. Más de dos millones de bloques de piedra caliza y granito, alineados con los puntos cardinales con un error mínimo.","k":"La forma pura: cuatro triángulos sobre un cuadrado. Originalmente estaba revestida de caliza blanca pulida que reflejaba el sol.","co":[29.9792,31.1342],"img":1,"cr":"Nina","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Kheops-Pyramid.jpg"},{"id":"stonehenge","t":"Stonehenge","a":"Autores desconocidos (Neolítico)","y":-2500,"yd":"c. 3000–2000 a.C.","c":"Wiltshire","p":"Reino Unido","per":"antigua","est":"Megalítico","esc":"conjunto","tags":[],"d":"Círculo de grandes piedras levantado en varias fases durante unos mil años. Su eje se alinea con la salida del sol en el solsticio de verano.","k":"El sistema de dintel sobre dos pilares, el gesto constructivo más antiguo de la arquitectura, unido con encastres copiados de la carpintería.","co":[51.1789,-1.8261],"img":1,"cr":"Stefan Kühn","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Stonehenge_Total.jpg"},{"id":"persepolis","t":"Persépolis","a":"Encargo de Darío I","y":-518,"yd":"c. 518 a.C.","c":"Fars","p":"Irán","per":"antigua","est":"Aqueménida","esc":"conjunto","tags":[],"d":"Capital ceremonial del Imperio persa aqueménida, levantada sobre una gran terraza artificial. Alejandro Magno la incendió en el 330 a.C.","k":"La Apadana, sala de audiencias con un bosque de columnas altísimas coronadas por toros de doble cabeza.","co":[29.935,52.89],"img":1,"cr":"Alborzagros","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Gate_of_All_Nations,_Persepolis.jpg"},{"id":"partenon","t":"Partenón","a":"Ictino y Calícrates; escultura de Fidias","y":-438,"yd":"447–432 a.C.","c":"Atenas","p":"Grecia","per":"antigua","est":"Clásico griego (dórico)","esc":"edificio","tags":[],"d":"Templo dedicado a Atenea en la Acrópolis, símbolo de la Atenas de Pericles. Es la referencia de proporción y orden clásico para toda la arquitectura occidental posterior.","k":"No hay líneas rectas: el basamento se curva hacia arriba y las columnas se ensanchan levemente (éntasis) para corregir ilusiones ópticas.","co":[37.9715,23.7266],"img":1,"cr":"Steve Swayne","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:The_Parthenon_in_Athens.jpg"},{"id":"pontdugard","t":"Pont du Gard","a":"Ingenieros romanos","y":50,"yd":"s. I d.C.","c":"Vers-Pont-du-Gard","p":"Francia","per":"antigua","est":"Romano","esc":"conjunto","tags":[],"d":"Puente del acueducto que llevaba agua a Nîmes a lo largo de unos 50 km, con una pendiente de apenas centímetros por kilómetro. Tres niveles de arcos de piedra sin mortero.","k":"Arquitectura como infraestructura: la belleza viene de repetir un solo elemento, el arco, a tres escalas.","co":[43.9473,4.5355],"img":1,"cr":"Benh LIEU SONG (Flickr)","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Pont_du_Gard_BLS.jpg"},{"id":"petra","t":"El Tesoro (Al-Khazneh), Petra","a":"Nabateos","y":50,"yd":"s. I d.C.","c":"Petra","p":"Jordania","per":"antigua","est":"Nabateo-helenístico","esc":"edificio","tags":[],"d":"Fachada monumental tallada directamente en la roca arenisca rosada, probablemente un mausoleo real. Se descubre al final de un desfiladero estrecho, el Siq.","k":"Arquitectura por sustracción: nada se construyó, todo se quitó de la montaña.","co":[30.3221,35.4515],"img":1,"cr":"Al_Khazneh_Petra.jpg: Graham Racher from London, UK derivative work: MrPanyGoff","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Al_Khazneh_Petra_edit_2.jpg"},{"id":"coliseo","t":"Coliseo","a":"Dinastía Flavia","y":80,"yd":"70–80 d.C.","c":"Roma","p":"Italia","per":"antigua","est":"Romano","esc":"edificio","tags":[],"d":"Anfiteatro para unas 50.000 personas, con un sistema de accesos tan eficiente que se vaciaba en minutos. Combina hormigón romano, piedra travertino y ladrillo.","k":"La fachada superpone órdenes: dórico-toscano abajo, jónico en el medio y corintio arriba.","co":[41.8903,12.4922],"img":1,"cr":"FeaturedPics","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Colosseo_2020.jpg"},{"id":"panteon","t":"Panteón de Roma","a":"Encargo de Adriano (autor incierto)","y":125,"yd":"c. 113–125 d.C.","c":"Roma","p":"Italia","per":"antigua","est":"Romano","esc":"edificio","tags":[],"d":"Templo con la cúpula de hormigón sin armar más grande del mundo, aún en uso después de casi 1.900 años. El interior encierra una esfera perfecta de 43 m de diámetro.","k":"El óculo de 9 m en la cima es la única fuente de luz: un disco de sol que recorre el interior durante el día.","co":[41.8986,12.4769],"img":1,"cr":"NikonZ7II","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Pantheon_(Rome)_-_Right_side_and_front.jpg"},{"id":"teotihuacan","t":"Pirámide del Sol, Teotihuacán","a":"Constructores teotihuacanos","y":200,"yd":"c. 200 d.C.","c":"Teotihuacán","p":"México","per":"antigua","est":"Mesoamericano","esc":"ciudad","tags":["latam"],"d":"Una de las pirámides más grandes de Mesoamérica, en una ciudad que llegó a tener más de 100.000 habitantes. Todo el trazado urbano sigue una orientación precisa.","k":"La Calzada de los Muertos, eje de más de 2 km que ordena la ciudad entera y enmarca los cerros del paisaje.","co":[19.6925,-98.8438],"img":1,"cr":"Burkhard Mücke","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:2020-02-11_Teotihuacan_la_Avenida_de_los_Muertos_y_la_Pir%C3%A1mide_del_Sol.jpg"},{"id":"santasofia","t":"Santa Sofía","a":"Antemio de Tralles e Isidoro de Mileto","y":537,"yd":"532–537","c":"Estambul","p":"Turquía","per":"media","est":"Bizantino","esc":"edificio","tags":[],"d":"Basílica del emperador Justiniano, luego mezquita, museo y otra vez mezquita. Su cúpula parece flotar sobre un anillo de ventanas.","k":"Las pechinas: triángulos curvos que permiten apoyar una cúpula redonda sobre una planta cuadrada.","co":[41.0083,28.98],"img":1,"cr":"Arild Vågen","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Hagia_Sophia_Mars_2013.jpg"},{"id":"horyuji","t":"Templo Hōryū-ji","a":"Encargo del príncipe Shōtoku","y":700,"yd":"c. 607 / reconstr. c. 700","c":"Ikaruga","p":"Japón","per":"media","est":"Budista japonés","esc":"conjunto","tags":[],"d":"Contiene algunos de los edificios de madera más antiguos del mundo. Su pagoda de cinco pisos resiste terremotos desde hace más de 1.300 años.","k":"El pilar central de la pagoda no sostiene: cuelga y amortigua, como un péndulo, el movimiento sísmico.","co":[34.6144,135.7342],"img":1,"cr":"663highland","lic":"CC BY 2.5","src":"https://commons.wikimedia.org/wiki/File:Horyu-ji45s2s4500.jpg"},{"id":"tikal","t":"Templo I de Tikal","a":"Encargo de Jasaw Chan K'awiil I","y":732,"yd":"c. 732","c":"Petén","p":"Guatemala","per":"media","est":"Maya clásico","esc":"edificio","tags":["latam"],"d":"Pirámide funeraria de unos 47 m que emerge sobre la selva. Fue a la vez tumba y escenario de rituales.","k":"La crestería en la cima: un muro decorativo que agrega altura y era visible desde lejos.","co":[17.2221,-89.6231],"img":1,"cr":"autor en Commons","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Tikal_temple_jaguar.jpg"},{"id":"cordoba","t":"Mezquita de Córdoba","a":"Abderramán I y sucesores","y":987,"yd":"785–987","c":"Córdoba","p":"España","per":"media","est":"Islámico andalusí","esc":"edificio","tags":[],"d":"Ampliada cuatro veces durante dos siglos. En el siglo XVI se insertó una catedral en su centro.","k":"El bosque de columnas con arcos dobles bicolores, de piedra y ladrillo, que se repite hasta perderse de vista.","co":[37.8792,-4.7797],"img":1,"cr":"Toni Castillo Quero","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Mezquita_de_C%C3%B3rdoba_desde_el_aire_(C%C3%B3rdoba,_Espa%C3%B1a).jpg"},{"id":"borobudur","t":"Borobudur","a":"Dinastía Shailendra","y":825,"yd":"c. 800–825","c":"Java Central","p":"Indonesia","per":"media","est":"Budista javanés","esc":"conjunto","tags":[],"d":"El mayor templo budista del mundo: una montaña artificial de terrazas que se recorre en espiral. Tiene más de 2.600 relieves y 504 estatuas de Buda.","k":"El recorrido es la arquitectura: subir es pasar del mundo del deseo a la iluminación.","co":[-7.6079,110.2038],"img":1,"cr":"Gunawan Kartapranata","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Borobudur-Nothwest-view.jpg"},{"id":"chichen","t":"El Castillo, Chichén Itzá","a":"Mayas y toltecas","y":1000,"yd":"s. IX–XII","c":"Yucatán","p":"México","per":"media","est":"Maya-tolteca","esc":"edificio","tags":["latam"],"d":"Templo de Kukulkán: cuatro escaleras de 91 escalones que, junto con la plataforma superior, suman 365, los días del año. Funciona como un calendario de piedra.","k":"En los equinoccios la sombra de las aristas dibuja una serpiente que baja por la escalera norte.","co":[20.6829,-88.5686],"img":1,"cr":"Daniel Schwen","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Chichen_Itza_3.jpg"},{"id":"angkor","t":"Angkor Wat","a":"Encargo de Suryavarman II","y":1150,"yd":"c. 1113–1150","c":"Siem Riep","p":"Camboya","per":"media","est":"Jemer","esc":"conjunto","tags":[],"d":"El monumento religioso más grande del mundo, primero hindú y luego budista. Representa el monte Meru, centro del universo, rodeado por un foso que simboliza el océano.","k":"Las cinco torres en forma de flor de loto, vistas reflejadas en los estanques al amanecer.","co":[13.4125,103.8667],"img":1,"cr":"The original uploader was Fuzheado at English Wikipedia.","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Angkor_wat_temple.jpg"},{"id":"notredame","t":"Notre-Dame de París","a":"Maurice de Sully y maestros constructores","y":1345,"yd":"1163–1345","c":"París","p":"Francia","per":"media","est":"Gótico","esc":"edificio","tags":[],"d":"Una de las primeras catedrales en usar arbotantes. Tras el incendio de 2019 fue restaurada y reabrió en diciembre de 2024.","k":"Los arbotantes: brazos de piedra exteriores que empujan contra los muros y permiten abrir enormes rosetones.","co":[48.853,2.3498],"img":1,"cr":"P e z i","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Notre-Dame_de_Paris_2013-07-24.jpg"},{"id":"chartres","t":"Catedral de Chartres","a":"Maestros constructores anónimos","y":1220,"yd":"1194–1220","c":"Chartres","p":"Francia","per":"media","est":"Gótico","esc":"edificio","tags":[],"d":"Reconstruida en apenas 26 años tras un incendio, lo que le da una unidad poco común. Conserva casi todos sus vitrales originales.","k":"El laberinto dibujado en el piso de la nave, recorrido por los peregrinos como un viaje simbólico.","co":[48.4478,1.4878],"img":1,"cr":"BT","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Westfassade_Chartres.jpg"},{"id":"zimbabwe","t":"Gran Zimbabue","a":"Pueblo shona","y":1300,"yd":"s. XI–XV","c":"Masvingo","p":"Zimbabue","per":"media","est":"Shona","esc":"ciudad","tags":[],"d":"Capital de un reino comercial del sur de África. Sus muros de granito, de hasta 11 m de alto, se levantaron sin mortero.","k":"La gran muralla curva del Gran Recinto y su torre cónica maciza, de uso todavía discutido.","co":[-20.27,30.933],"img":1,"cr":"autor en Commons","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Great-Zimbabwe-6.jpg"},{"id":"alhambra","t":"Alhambra","a":"Dinastía nazarí","y":1350,"yd":"s. XIII–XIV","c":"Granada","p":"España","per":"media","est":"Nazarí","esc":"conjunto","tags":[],"d":"Ciudad palatina sobre una colina, con palacios, jardines y fortificaciones. Es la cumbre de la arquitectura islámica en la península ibérica.","k":"El Patio de los Leones: agua, luz y yeserías tan finas que el muro parece encaje.","co":[37.1763,-3.5882],"img":1,"cr":"Jebulon","lic":"CC0","src":"https://commons.wikimedia.org/wiki/File:Alhambra_detail.jpg"},{"id":"ciudadprohibida","t":"Ciudad Prohibida","a":"Kuai Xiang y otros (dinastía Ming)","y":1420,"yd":"1406–1420","c":"Pekín","p":"China","per":"moderna","est":"Imperial chino","esc":"conjunto","tags":[],"d":"Palacio imperial durante cinco siglos, con unos 980 edificios dentro de un recinto amurallado. Todo se ordena sobre un eje norte-sur.","k":"El techo: su forma, su color amarillo y la cantidad de figuras en las aristas indican el rango de cada edificio.","co":[39.9158,116.3908],"img":1,"cr":"N509FZ","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Hall_of_Supreme_Harmony_(20241127120000).jpg"},{"id":"brunelleschi","t":"Cúpula de Santa María del Fiore","a":"Filippo Brunelleschi","y":1436,"yd":"1420–1436","c":"Florencia","p":"Italia","per":"moderna","est":"Renacimiento","esc":"edificio","tags":[],"d":"Brunelleschi resolvió una cúpula que nadie sabía construir, sin cimbra de madera completa. Fue el inicio simbólico del Renacimiento.","k":"Ladrillos en espina de pez y dos cáscaras, una dentro de la otra, para que la cúpula se sostenga a sí misma mientras crece.","co":[43.7731,11.2569],"img":1,"cr":"Petar Milošević","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Florence_Duomo_from_Michelangelo_hill.jpg"},{"id":"machupicchu","t":"Machu Picchu","a":"Encargo de Pachacútec (incas)","y":1450,"yd":"c. 1450","c":"Cusco","p":"Perú","per":"moderna","est":"Inca","esc":"ciudad","tags":["latam"],"d":"Residencia real inca en una cresta andina a 2.430 m. Terrazas, templos y viviendas se adaptan a la montaña.","k":"La piedra inca encajada sin mortero, tan precisa que no entra un papel entre los bloques; resiste sismos.","co":[-13.1633,-72.5456],"img":1,"cr":"Draceane","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Machu_Picchu,_2023_(012).jpg"},{"id":"tempietto","t":"Tempietto de San Pietro in Montorio","a":"Donato Bramante","y":1502,"yd":"c. 1502","c":"Roma","p":"Italia","per":"moderna","est":"Alto Renacimiento","esc":"pabellon","tags":[],"d":"Pequeño templo circular en el lugar donde según la tradición fue crucificado San Pedro. Con apenas 4,5 m de diámetro interior, fue un manifiesto del Renacimiento.","k":"Un edificio diminuto que funciona como modelo ideal: planta circular, columnas dóricas y cúpula.","img":1,"cr":"Labicanense","lic":"CC BY 4.0","src":"https://commons.wikimedia.org/wiki/File:Tempietto_di_San_Pietro_in_Montorio.jpg"},{"id":"suleymaniye","t":"Mezquita de Solimán","a":"Mimar Sinan","y":1557,"yd":"1550–1557","c":"Estambul","p":"Turquía","per":"moderna","est":"Otomano clásico","esc":"conjunto","tags":[],"d":"Obra maestra del arquitecto imperial Sinan, que diseñó cientos de edificios. El complejo incluía escuelas, hospital, baños y cocina pública.","k":"Una cúpula central con semicúpulas escalonadas que bajan como una cascada hacia los minaretes.","co":[41.0161,28.9639],"img":1,"cr":"Hunanuk","lic":"CC0","src":"https://commons.wikimedia.org/wiki/File:S%C3%BCleymaniyeMosqueIstanbul_(cropped).jpg"},{"id":"rotonda","t":"Villa La Rotonda","a":"Andrea Palladio; terminada por Vincenzo Scamozzi","y":1590,"yd":"1567–c. 1590","c":"Vicenza","p":"Italia","per":"moderna","est":"Renacimiento palladiano","esc":"edificio","tags":[],"d":"Villa en lo alto de una colina con cuatro fachadas iguales, una hacia cada vista del paisaje. Fue copiada en todo el mundo, de Inglaterra a Estados Unidos.","k":"Simetría total: cuatro pórticos de templo griego aplicados a una casa.","co":[45.5315,11.5603],"img":1,"cr":"Quinok","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:07-Villa-Rotonda-Palladio.jpg"},{"id":"sanpedro","t":"Basílica de San Pedro","a":"Bramante, Miguel Ángel, Carlo Maderno y Gian Lorenzo Bernini","y":1626,"yd":"1506–1626","c":"Ciudad del Vaticano","p":"Vaticano","per":"moderna","est":"Renacimiento y Barroco","esc":"edificio","tags":[],"d":"Más de un siglo de obra y varios arquitectos. La cúpula es de Miguel Ángel y la plaza con columnatas de Bernini.","k":"La columnata de Bernini como dos brazos que abrazan a quien llega.","img":1,"cr":"Alvesgaspar","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Basilica_di_San_Pietro_in_Vaticano_September_2015-1a.jpg"},{"id":"isfahan","t":"Mezquita del Imán, Isfahán","a":"Ali Akbar Isfahani","y":1629,"yd":"1611–1629","c":"Isfahán","p":"Irán","per":"moderna","est":"Safávida","esc":"edificio","tags":[],"d":"Cubierta casi por completo de azulejos de siete colores. La entrada sobre la plaza está girada respecto de la mezquita para orientarla hacia La Meca.","k":"Los muqarnas: bóvedas de pequeñas celdas que descomponen la luz como un panal.","co":[32.6548,51.6778],"img":1,"cr":"autor en Commons","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Naghsh-e-jahan_masjed-e-shah_esfahan.jpg"},{"id":"borromini","t":"San Carlo alle Quattro Fontane","a":"Francesco Borromini","y":1646,"yd":"1638–1646 (fachada 1677)","c":"Roma","p":"Italia","per":"moderna","est":"Barroco","esc":"edificio","tags":[],"d":"Una iglesia diminuta, del tamaño de un pilar de San Pedro, construida en una esquina estrecha. Toda la geometría se curva.","k":"La cúpula ovalada con casetones que se achican hacia arriba para parecer más alta.","co":[41.9018,12.4907],"img":1,"cr":"Architas","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:San_Carlo_alle_Quattro_Fontane_-_Front.jpg"},{"id":"tajmahal","t":"Taj Mahal","a":"Ustad Ahmad Lahauri (atribuido)","y":1653,"yd":"1632–1653","c":"Agra","p":"India","per":"moderna","est":"Mogol","esc":"conjunto","tags":[],"d":"Mausoleo que el emperador Shah Jahan construyó para su esposa Mumtaz Mahal. Mármol blanco con incrustaciones de piedras semipreciosas.","k":"Los minaretes se inclinan levemente hacia afuera: si un sismo los derribara, caerían lejos de la tumba.","co":[27.175,78.0419],"img":1,"cr":"Taj_Mahal,_Agra,_India_edit2.jpg: Yann; edited by King of Hearts derivative work","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Taj_Mahal,_Agra,_India_edit3.jpg"},{"id":"katsura","t":"Villa Imperial Katsura","a":"Príncipes Toshihito y Toshitada","y":1660,"yd":"1615–c. 1660","c":"Kioto","p":"Japón","per":"moderna","est":"Sukiya japonés","esc":"conjunto","tags":[],"d":"Villa y jardín que Bruno Taut, Walter Gropius y otros modernos vieron como un antecedente de su propia arquitectura. Modulada por el tatami.","k":"Los pabellones escalonados en diagonal, que se abren al jardín con paneles corredizos.","co":[34.9839,135.7094],"img":1,"cr":"John Chang","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Katsura_Imperial_Villa_in_Spring.jpg"},{"id":"sanignacio","t":"San Ignacio Miní","a":"Misioneros jesuitas y pueblo guaraní","y":1720,"yd":"s. XVII–XVIII","c":"Misiones","p":"Argentina","per":"moderna","est":"Barroco guaraní","esc":"ciudad","tags":["latam"],"d":"Ruinas de una de las reducciones jesuíticas guaraníes. Los pueblos se organizaban alrededor de una gran plaza con la iglesia como cabecera.","k":"La piedra arenisca roja tallada por artesanos guaraníes con motivos que mezclan el barroco europeo y la flora local.","co":[-27.2553,-55.5317],"img":1,"cr":"Loco085","lic":"CC BY-SA 2.5","src":"https://commons.wikimedia.org/wiki/File:Ruinas-san-ignacio.jpg"},{"id":"arcetsenans","t":"Salinas Reales de Arc-et-Senans","a":"Claude-Nicolas Ledoux","y":1779,"yd":"1775–1779","c":"Arc-et-Senans","p":"Francia","per":"industrial","est":"Neoclásico visionario","esc":"conjunto","tags":[],"d":"Fábrica de sal pensada como una ciudad ideal en semicírculo, con la casa del director en el centro. Una arquitectura que imagina cómo organizar el trabajo.","k":"Las columnas de tambores alternados cuadrados y redondos, y los relieves de agua salada petrificada.","co":[47.0328,5.7778],"img":1,"cr":"Stefan Kühn","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Koenigliche_Saline_in_Arc-et-Senans_Bild1_800px.jpg"},{"id":"labrouste","t":"Biblioteca Sainte-Geneviève","a":"Henri Labrouste","y":1851,"yd":"1843–1851","c":"París","p":"Francia","per":"industrial","est":"Neogriego / hierro","esc":"edificio","tags":[],"d":"Una de las primeras grandes obras públicas en mostrar una estructura de hierro fundido en el interior. Afuera, piedra clásica; adentro, la nueva técnica.","k":"La sala de lectura con dos naves de bóvedas sostenidas por finos arcos de hierro calado.","img":1,"cr":"Marie-Lan Nguyen","lic":"CC BY 2.0 fr","src":"https://commons.wikimedia.org/wiki/File:Salle_de_lecture_Bibliotheque_Sainte-Genevieve_n03.jpg"},{"id":"eixample","t":"Ensanche de Barcelona","a":"Ildefons Cerdà","y":1859,"yd":"1859","c":"Barcelona","p":"España","per":"industrial","est":"Urbanismo higienista","esc":"ciudad","tags":[],"d":"Plan de expansión con una cuadrícula regular de manzanas de 113 m. Cerdà estudió el sol, la ventilación y el tránsito para una ciudad más sana.","k":"Las esquinas cortadas en ochava de las manzanas, que forman pequeñas plazas en cada cruce.","co":[41.392,2.1633],"img":1,"cr":"Alhzeiia","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Eixample_aire_cropped.jpg"},{"id":"garnier","t":"Ópera Garnier","a":"Charles Garnier","y":1875,"yd":"1861–1875","c":"París","p":"Francia","per":"industrial","est":"Beaux-Arts / Segundo Imperio","esc":"edificio","tags":[],"d":"Teatro de ópera del París de Haussmann, pensado tanto para ver como para ser visto. Su gran escalera es el verdadero escenario social.","k":"La gran escalera de mármol de colores, donde el público se exhibe antes de la función.","co":[48.8719,2.3317],"img":1,"cr":"Alexander Hoernigk","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Paris_Palais_Garnier_2010-04-06_16.55.07.jpg"},{"id":"galleria","t":"Galería Vittorio Emanuele II","a":"Giuseppe Mengoni","y":1877,"yd":"1865–1877","c":"Milán","p":"Italia","per":"industrial","est":"Eclecticismo / hierro y vidrio","esc":"conjunto","tags":[],"d":"Una de las galerías comerciales cubiertas más antiguas del mundo, con forma de cruz. Une la plaza del Duomo con la de la Scala.","k":"La cúpula de hierro y vidrio en el cruce: una calle convertida en interior.","co":[45.4656,9.19],"img":1,"cr":"Paolobon140","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Veduta_della_Galleria_Vittorio_Emanuele_II_da_piazza_del_Duomo,_Milano.jpg"},{"id":"brooklyn","t":"Puente de Brooklyn","a":"John A. Roebling, Washington Roebling y Emily Warren Roebling","y":1883,"yd":"1869–1883","c":"Nueva York","p":"Estados Unidos","per":"industrial","est":"Ingeniería del siglo XIX","esc":"conjunto","tags":[],"d":"Al inaugurarse, el puente colgante más largo del mundo. Cuando Washington Roebling enfermó, su esposa Emily llevó adelante la dirección de la obra.","k":"Las torres de piedra con arcos neogóticos que sostienen una red de cables de acero.","co":[40.7057,-73.9963],"img":1,"cr":"Christian David","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Brooklyn_Bridge_and_the_Lower_Manhattan_skyline_from_Pebble_Beach,_New_York.jpg"},{"id":"sagrada","t":"Sagrada Familia","a":"Antoni Gaudí","y":1882,"yd":"1882–en obra","c":"Barcelona","p":"España","per":"industrial","est":"Modernismo catalán","esc":"edificio","tags":[],"d":"Gaudí trabajó en ella más de 40 años y sabía que no la vería terminada. Sigue en construcción con métodos digitales.","k":"Las columnas que se ramifican como árboles: Gaudí calculó las formas con maquetas colgantes de cuerdas y pesos.","co":[41.4037,2.1743],"img":1,"cr":"Canaan","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:SF_maig_2026.jpg"},{"id":"laplata","t":"Ciudad de La Plata","a":"Pedro Benoit (plan urbano)","y":1882,"yd":"1882","c":"La Plata","p":"Argentina","per":"industrial","est":"Urbanismo higienista","esc":"ciudad","tags":["latam"],"d":"Capital provincial fundada desde cero y trazada de una sola vez. Un cuadrado con diagonales y una plaza cada seis cuadras.","k":"El eje monumental que une los edificios públicos y las diagonales que cruzan la cuadrícula.","co":[-34.9333,-57.95],"img":1,"cr":"Fungilover22","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Plano_fundacional.jpg"},{"id":"eiffel","t":"Torre Eiffel","a":"Gustave Eiffel, Maurice Koechlin, Émile Nouguier y Stephen Sauvestre","y":1889,"yd":"1887–1889","c":"París","p":"Francia","per":"industrial","est":"Ingeniería del hierro","esc":"conjunto","tags":[],"d":"Construida para la Exposición Universal de 1889 y criticada por muchos artistas de su época. Hoy es el símbolo de París.","k":"La curva de las patas sigue el cálculo de la fuerza del viento: es forma resultante de la ingeniería.","co":[48.8583,2.2945],"img":1,"cr":"Benh LIEU SONG","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Tour_Eiffel_Wikimedia_Commons.jpg"},{"id":"wainwright","t":"Wainwright Building","a":"Louis Sullivan y Dankmar Adler","y":1891,"yd":"1890–1891","c":"San Luis","p":"Estados Unidos","per":"industrial","est":"Escuela de Chicago","esc":"edificio","tags":[],"d":"Uno de los primeros rascacielos de estructura metálica. Sullivan lo usó para pensar qué aspecto debía tener un edificio alto.","k":"Base, fuste y remate como una columna clásica: 'la forma sigue a la función'.","co":[38.6269,-90.1922],"img":1,"cr":"autor en Commons","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Wainwright_building_st_louis_USA.jpg"},{"id":"batllo","t":"Casa Batlló","a":"Antoni Gaudí","y":1906,"yd":"1904–1906","c":"Barcelona","p":"España","per":"industrial","est":"Modernismo catalán","esc":"edificio","tags":[],"d":"Reforma total de un edificio existente en el Paseo de Gracia. Fachada ondulada, balcones como máscaras y un techo que evoca el lomo de un dragón.","k":"El patio de luces con azulejos que van de azul oscuro arriba a claro abajo, para repartir la luz por igual.","co":[41.3916,2.1649],"img":1,"cr":"ChristianSchd","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Casa_Batllo_Overview_Barcelona_Spain_cut.jpg"},{"id":"colon","t":"Teatro Colón","a":"Francesco Tamburini, Vittorio Meano y Jules Dormal","y":1908,"yd":"1889–1908","c":"Buenos Aires","p":"Argentina","per":"industrial","est":"Eclecticismo","esc":"edificio","tags":["latam"],"d":"Una de las salas de ópera con mejor acústica del mundo. Pasaron tres arquitectos por la obra durante casi 20 años.","k":"La sala en herradura con siete niveles de palcos y la cúpula pintada por Raúl Soldi en 1966.","co":[-34.6011,-58.3831],"img":1,"cr":"EEJCC","lic":"CC0","src":"https://commons.wikimedia.org/wiki/File:Fachada_del_Teatro_Col%C3%B3n_en_Buenos_Aires,_Argentina.jpg"},{"id":"barolo","t":"Palacio Barolo","a":"Mario Palanti","y":1923,"yd":"1919–1923","c":"Buenos Aires","p":"Argentina","per":"s20","est":"Eclecticismo","esc":"edificio","tags":["latam"],"d":"Fue el edificio más alto de Sudamérica al inaugurarse. Su diseño está inspirado en la Divina Comedia de Dante: infierno, purgatorio y paraíso.","k":"El faro en la cúpula, que se comunicaba con el Palacio Salvo, obra gemela de Palanti en Montevideo.","co":[-34.6096,-58.3859],"img":1,"cr":"Eugenio Hansen, OFS","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Palacio_Barolo_10.jpg"},{"id":"schroder","t":"Casa Rietveld Schröder","a":"Gerrit Rietveld y Truus Schröder-Schräder","y":1924,"yd":"1924","c":"Utrecht","p":"Países Bajos","per":"s20","est":"De Stijl","esc":"pabellon","tags":["mujer"],"d":"Casa diseñada junto con su clienta, Truus Schröder, que definió cómo quería vivir. Es la arquitectura del movimiento De Stijl hecha realidad.","k":"El piso alto sin paredes fijas: paneles corredizos lo transforman de un espacio abierto a varios cuartos.","co":[52.0853,5.1476],"img":1,"cr":"User:Husky","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Rietveld_Schr%C3%B6derhuis_HayKranen-20.JPG"},{"id":"frankfurt","t":"Cocina de Frankfurt","a":"Margarete Schütte-Lihotzky","y":1926,"yd":"1926","c":"Fráncfort","p":"Alemania","per":"s20","est":"Nueva Objetividad","esc":"objeto","tags":["mujer"],"d":"Cocina mínima y racional diseñada para la vivienda social, de la que se instalaron unas 10.000. Es el antecedente directo de la cocina integrada moderna.","k":"Cada movimiento estudiado como en una fábrica: cajones de aluminio rotulados, tabla plegable y todo a mano en 1,9 × 3,4 m.","img":1,"cr":"autor en Commons","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Frankfurterkueche.jpg"},{"id":"bauhaus","t":"Edificio de la Bauhaus","a":"Walter Gropius","y":1926,"yd":"1925–1926","c":"Dessau","p":"Alemania","per":"s20","est":"Movimiento Moderno","esc":"edificio","tags":[],"d":"Sede de la escuela que unió arte, artesanía e industria. Su planta en molinete no tiene una fachada principal: hay que rodearlo.","k":"La fachada de vidrio del bloque de talleres, separada de la estructura como una piel.","co":[51.8392,12.2267],"img":1,"cr":"A.Savin","lic":"FAL","src":"https://commons.wikimedia.org/wiki/File:Dessau_Bauhaus-Geb%C3%A4ude_asv2024-06_img1.jpg"},{"id":"e1027","t":"Villa E-1027","a":"Eileen Gray con Jean Badovici","y":1929,"yd":"1926–1929","c":"Roquebrune-Cap-Martin","p":"Francia","per":"s20","est":"Movimiento Moderno","esc":"pabellon","tags":["mujer"],"d":"Casa junto al Mediterráneo diseñada por la diseñadora irlandesa Eileen Gray, con muebles hechos para cada lugar. Durante décadas se la atribuyó por error a otros.","k":"Los muebles como arquitectura: mesas regulables, biombos y armarios que organizan el espacio.","co":[43.7599,7.4632],"img":1,"cr":"Tangopaso","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Sea_shore_at_Roquebrune.jpg"},{"id":"barcelona","t":"Pabellón de Barcelona","a":"Ludwig Mies van der Rohe y Lilly Reich","y":1929,"yd":"1929 (reconstruido 1986)","c":"Barcelona","p":"España","per":"s20","est":"Movimiento Moderno","esc":"pabellon","tags":["mujer"],"d":"Pabellón alemán de la Exposición Internacional, desmontado al terminar y reconstruido en 1986. Lilly Reich fue codiseñadora, incluida la silla Barcelona.","k":"Planos sueltos de mármol, ónix y vidrio que guían el recorrido sin cerrar nunca una habitación.","co":[41.3706,2.15],"img":1,"cr":"Ashley Pomeroy at English Wikipedia","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:The_Barcelona_Pavilion,_Barcelona,_2010.jpg"},{"id":"savoye","t":"Villa Savoye","a":"Le Corbusier y Pierre Jeanneret","y":1931,"yd":"1928–1931","c":"Poissy","p":"Francia","per":"s20","est":"Movimiento Moderno","esc":"pabellon","tags":[],"d":"La demostración de los 'cinco puntos de una nueva arquitectura' de Le Corbusier. Una caja blanca que parece flotar sobre el pasto.","k":"Pilotis, planta libre, fachada libre, ventana corrida y terraza jardín: buscalos todos.","co":[48.9244,2.0283],"nf":"Las obras de Le Corbusier en Francia siguen protegidas por derechos de autor hasta 2036, por eso no hay fotos libres de esta obra."},{"id":"kavanagh","t":"Edificio Kavanagh","a":"Gregorio Sánchez, Ernesto Lagos y Luis María de la Torre","y":1936,"yd":"1934–1936","c":"Buenos Aires","p":"Argentina","per":"s20","est":"Racionalismo / Art déco","esc":"edificio","tags":["latam"],"d":"Al inaugurarse, la estructura de hormigón armado más alta del mundo. Lo encargó Corina Kavanagh, una de las pocas mujeres desarrolladoras inmobiliarias de su época.","k":"Los volúmenes escalonados que se afinan hacia arriba como un transatlántico vertical.","co":[-34.5954,-58.3747],"img":1,"cr":"Marcos Prack","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:Kavanagh_building.jpg"},{"id":"fallingwater","t":"Casa de la Cascada","a":"Frank Lloyd Wright","y":1937,"yd":"1936–1937","c":"Mill Run, Pensilvania","p":"Estados Unidos","per":"s20","est":"Arquitectura orgánica","esc":"pabellon","tags":[],"d":"Casa construida sobre una cascada en lugar de frente a ella. Las terrazas de hormigón vuelan sobre el arroyo.","k":"La roca del lugar aflora en el piso del living, junto a la chimenea: la casa crece desde el paisaje.","co":[39.9064,-79.4681],"img":1,"cr":"Carol M. Highsmith","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Fallingwater_2007.jpg"},{"id":"bkf","t":"Silla BKF","a":"Antonio Bonet, Juan Kurchan y Jorge Ferrari Hardoy","y":1938,"yd":"1938","c":"Buenos Aires","p":"Argentina","per":"s20","est":"Movimiento Moderno","esc":"objeto","tags":["latam"],"d":"Diseñada en Buenos Aires por tres arquitectos del Grupo Austral y copiada millones de veces como 'silla mariposa'. El MoMA la incluyó en su colección.","k":"Una sola varilla de hierro doblada y un cuero que cuelga: la estructura mínima.","img":1,"cr":"Kippelboy","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:BKF_Chair.jpg"},{"id":"mairea","t":"Villa Mairea","a":"Alvar Aalto","y":1939,"yd":"1937–1939","c":"Noormarkku","p":"Finlandia","per":"s20","est":"Modernismo nórdico","esc":"pabellon","tags":[],"d":"Casa para una familia de coleccionistas en medio del bosque finlandés. Combina la abstracción moderna con madera, piedra y tradición local.","k":"Las columnas de acero envueltas en varillas de madera y mimbre, como troncos en el bosque.","co":[61.5975,21.8745],"img":1,"cr":"Ninara from Helsinki, Finland","lic":"CC BY 2.0","src":"https://commons.wikimedia.org/wiki/File:4Y1A7841_Alvar_Aalto,_Finland_(26710745140).jpg"},{"id":"capanema","t":"Palacio Gustavo Capanema","a":"Lúcio Costa, Oscar Niemeyer, Affonso Reidy y equipo; consultor Le Corbusier","y":1945,"yd":"1936–1945","c":"Río de Janeiro","p":"Brasil","per":"s20","est":"Movimiento Moderno","esc":"edificio","tags":["latam","pritzker"],"d":"Antiguo Ministerio de Educación, uno de los primeros rascacielos modernos del mundo. Fue la escuela del joven Niemeyer.","k":"Los parasoles móviles en la fachada norte y los murales de azulejos de Candido Portinari.","co":[-22.9092,-43.1738],"img":1,"cr":"Imagens AMB","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:MESP4.jpg"},{"id":"puente","t":"Casa sobre el Arroyo","a":"Amancio Williams","y":1946,"yd":"1943–1946","c":"Mar del Plata","p":"Argentina","per":"s20","est":"Movimiento Moderno","esc":"pabellon","tags":["latam"],"d":"Casa-puente apoyada en una sola bóveda de hormigón sobre el arroyo Las Chacras. Fue encargada por el padre de Amancio, el compositor Alberto Williams.","k":"La casa ES el puente: un arco que cruza el agua y libera el suelo del parque.","img":1,"cr":"Claudio Elias","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Casa_del_Puente_MDP.jpg"},{"id":"hearst","t":"Castillo Hearst","a":"Julia Morgan","y":1947,"yd":"1919–1947","c":"San Simeón, California","p":"Estados Unidos","per":"s20","est":"Eclecticismo / Renacimiento español","esc":"conjunto","tags":["mujer"],"d":"Residencia del magnate William Randolph Hearst, proyectada durante casi 30 años. Julia Morgan fue la primera mujer en recibirse de arquitecta en la École des Beaux-Arts de París y diseñó más de 700 edificios.","k":"La piscina Neptuno, con un templo romano reconstruido junto al agua.","co":[35.6853,-121.1678],"img":1,"cr":"No machine-readable author provided. Urban~commonswiki assumed (based on copyrig","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Hearst_Castle_Casa_Grande1.jpg"},{"id":"casabarragan","t":"Casa Luis Barragán","a":"Luis Barragán","y":1948,"yd":"1948","c":"Ciudad de México","p":"México","per":"s20","est":"Modernismo mexicano","esc":"pabellon","tags":["latam","pritzker"],"d":"La casa y estudio donde vivió Barragán, cerrada a la calle y abierta hacia un jardín. Patrimonio de la Humanidad.","k":"La escalera de madera sin baranda que flota contra un muro blanco, y los muros de color rosa, amarillo y azul.","co":[19.4111,-99.1925],"img":1,"cr":"Ymblanter","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Luis_Barragan_Hou jer"],"d":"La casa donde vivió Lina Bo Bardi, entonces en las afueras de São Paulo. La selva fue creciendo hasta rodearla por completo.","k":"El salón de vidrio en voladizo sobre pilotes finos, con un árbol que atraviesa un patio en el centro.","img":1,"cr":"Monica Kaneko from Sao Paulo, Brasil","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Casa_de_Vidro_-_Instituto_Bardi_01.jpg"},{"id":"lever","t":"Lever House","a":"Gordon Bunshaft y Natalie de Blois (SOM)","y":1952,"yd":"1950–1952","c":"Nueva York","p":"Estados Unidos","per":"s20","est":"Estilo Internacional","esc":"edificio","tags":["pritzker","mujer"],"d":"Uno de los primeros rascacielos de muro cortina de vidrio en Nueva York. Natalie de Blois fue una de las diseñadoras clave del proyecto.","k":"Una lámina vertical sobre un bloque bajo que deja libre una plaza pública en planta baja.","co":[40.7597,-73.9728],"img":1,"cr":"Beyond My Ken","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Lever_House_390_Park_Avenue.jpg"},{"id":"unite","t":"Unidad Habitacional de Marsella","a":"Le Corbusier","y":1952,"yd":"1947–1952","c":"Marsella","p":"Francia","per":"s20","est":"Brutalismo","esc":"conjunto","tags":[],"d":"Una 'ciudad vertical' de 337 departamentos con calle comercial interior y escuela en la terraza. Modelo de miles de bloques de vivienda en el mundo.","k":"Los departamentos dúplex encajados como botellas en un botellero, y la terraza escultórica.","img":1,"cr":"Anapuig","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Unit%C3%A9_d%27Habitation_de_Marseille_4.JPG"},{"id":"ucv","t":"Aula Magna, Ciudad Universitaria de Caracas","a":"Carlos Raúl Villanueva; nubes de Alexander Calder","y":1953,"yd":"1952–1953","c":"Caracas","p":"Venezuela","per":"s20","est":"Modernismo latinoamericano","esc":"conjunto","tags":["latam"],"d":"El campus integra arquitectura, pintura y escultura en lo que Villanueva llamó 'síntesis de las artes'. Patrimonio de la Humanidad.","k":"Las 'nubes' acústicas de Calder suspendidas del techo del Aula Magna: arte que también corrige el sonido.","img":1,"cr":"Caracas1830","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:Aula_Magna-Calder-UCV.JPG"},{"id":"curutchet","t":"Casa Curutchet","a":"Le Corbusier; dirección de obra Amancio Williams","y":1953,"yd":"1949–1953","c":"La Plata","p":"Argentina","per":"s20","est":"Movimiento Moderno","esc":"pabellon","tags":["latam"],"d":"La única obra de Le Corbusier en América Latina construida según su proyecto: casa y consultorio de un cirujano. Le Corbusier nunca la visitó.","k":"La rampa que conecta consultorio y vivienda alrededor de un árbol, y el parasol de hormigón hacia el parque.","co":[-34.9113,-57.9419],"img":1,"cr":"Danielsantiago9128","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Casa_Curutchet_1..JPG"},{"id":"ronchamp","t":"Capilla de Ronchamp","a":"Le Corbusier","y":1955,"yd":"1950–1955","c":"Ronchamp","p":"Francia","per":"s20","est":"Modernismo escultórico","esc":"edificio","tags":[],"d":"Una capilla de peregrinación que rompe con la caja moderna. El techo curvo parece una vela o un caparazón.","k":"Una franja de luz entre el muro y el techo, y ventanas de colores incrustadas en un muro grueso.","nf":"Las obras de Le Corbusier en Francia siguen protegidas por derechos de autor hasta 2036, por eso no hay fotos libres de esta obra."},{"id":"mamrio","t":"Museo de Arte Moderno de Río","a":"Affonso Eduardo Reidy; paisajismo de Roberto Burle Marx","y":1958,"yd":"1953–1967","c":"Río de Janeiro","p":"Brasil","per":"s20","est":"Modernismo brasileño","esc":"edificio","tags":["latam"],"d":"El museo frente a la bahía de Guanabara, en el parque de Flamengo. Los pórticos inclinados liberan la planta baja como continuación del parque.","k":"Los pórticos de hormigón en forma de V que sostienen toda la sala de exposiciones sin columnas interiores.","co":[-22.9138,-43.1718],"img":1,"cr":"Imagens AMB","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Museu_de_Arte_Moderna,_Rio_de_Janeiro_(2001).jpg"},{"id":"manantiales","t":"Restaurante Los Manantiales","a":"Félix Candela con Joaquín y Fernando Álvarez Ordóñez","y":1958,"yd":"1958","c":"Xochimilco, Ciudad de México","p":"México","per":"s20","est":"Cascarones de hormigón","esc":"edificio","tags":["latam"],"d":"Una flor de ocho pétalos hecha con una cáscara de hormigón de apenas 4 cm de espesor. Candela fue el gran maestro de los paraboloides hiperbólicos.","k":"Cada pétalo es un paraboloide hiperbólico: una superficie curva que se construye con tablas rectas.","img":1,"cr":"Dge","lic":"CC BY-SA 3.0","src":"https://commons.wikimedia.org/wiki/File:Restaurante_Los_Manantiales_02.jpg"},{"id":"seagram","t":"Seagram Building","a":"Ludwig Mies van der Rohe y Philip Johnson","y":1958,"yd":"1954–1958","c":"Nueva York","p":"Estados Unidos","per":"s20","est":"Estilo Internacional","esc":"edificio","tags":["pritzker"],"d":"El rascacielos que fijó el modelo de torre corporativa. Se retira de la avenida para dejar una plaza pública.","k":"Los perfiles de bronce en la fachada no son estructura: son ornamento que expresa la estructura escondida.","co":[40.7584,-73.9721],"img":1,"cr":"Max Hermus at Dutch Wikipedia","lic":"Public domain","src":"https://commons.wikimedia.org/wiki/File:Seagrambuilding.JPG"},{"id":"satelite","t":"Torres de Satélite","a":"Luis Barragán y Mathias Goeritz","y":1958,"yd":"1958","c":"Naucalpan, Estado de México","p":"México","per":"s20","est":"Arquitectura emocional","esc":"conjunto","tags":["latam","pritzker"],"d":"Cinco prismas triangulares de colores, de hasta 52 m, como puerta de una nueva ciudad satélite. Escultura urbana vista desde el auto.","k":"Cambian de forma según desde dónde se las mire mientras uno pasa por la autopista.","co":[19.4992,-99.2369],"img":1,"cr":"ProtoplasmaKid","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Torres_de_Sat%C3%A9lite_-_2.jpg"},{"id":"guggenheimny","t":"Museo Guggenheim de Nueva York","a":"Frank Lloyd Wright","y":1959,"yd":"1943–1959","c":"Nueva York","p":"Estados Unidos","per":"s20","est":"Arquitectura orgánica","esc":"edificio","tags":[],"d":"Un museo que es una rampa continua en espiral alrededor de un vacío central. Se recorre bajando desde arriba.","k":"La espiral se ensancha hacia arriba, al revés que un zigurat.","co":[40.7831,-73.9589],"img":1,"cr":"Jean-Christophe BENOIST","lic":"CC BY 3.0","src":"https://commons.wikimedia.org/wiki/File:NYC_-_Guggenheim_Museum.jpg"},{"id":"brasilia","t":"Plan Piloto de Brasilia","a":"Lúcio Costa (urbanismo) y Oscar Niemeyer (edificios)","y":1960,"yd":"1956–1960","c":"Brasilia","p":"Brasil","per":"s20","est":"Urbanismo moderno","esc":"ciudad","tags":["latam","pritzker"],"d":"Capital construida en el interior de Brasil en menos de cuatro años. Su plano, en forma de avión o cruz, separa el eje monumental del eje residencial.","k":"Las supercuadras: bloques de vivienda sobre pilotes con escuela y comercio a distancia caminable.","co":[-15.7939,-47.8828],"img":1,"cr":"Arturdiasr","lic":"CC BY-SA 4.0","src":"https://commons.wikimedia.org/wiki/File:Planalto_Central_(cropped).jpg"},{"id":"congreso","t":"Congreso Nacional de Brasil","a":"Oscar Niemeyer","y":1960,"yd":"1958–1960","c":"Brasilia","p":"Brasil","per":"s20","est":"Modernismo brasileño","esc":"edificio","tags":["latam","pritzker"],"d":"Dos torres de oficinas y dos cúpulas, una hacia arriba (Senado) y otra invertida (Cámara de Diputados). Niemeyer ganó el Pritzker en 1988.","k":"La cúpula hacia abajo y la cúpula hacia arriba: geometría simple usada como símbolo.","co":[-15.7997,-47.8642],"img":1,"cr":"P - A - S","lic":"CC BY-SA 2.0","src":"https://commons.wikimedia.org/wiki/File:Congresso_do_Brasil.jpg"},{"id":"dieste","t":"Iglesia de Cristo Obrero","a":"Eladio Dieste","y":1960,"yd":"1958–1960","c":"Atlántida","p":"Uruguay","per":"s20","est":"Cerámica armada","esc":"edificio","tags":["latam"],"d":"El ingeniero Eladio Diest
